[workspace]
resolver = "2"
members = [
    "crates/telepty-supervisor-core",
    "crates/telepty-supervisor-bin",
    "crates/telepty-cross-machine",
]

[workspace.package]
edition = "2021"
rust-version = "1.82.0"
license = "MIT"
repository = "https://github.com/dmsdc-ai/aigentry-telepty"

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "io-util", "net", "signal", "fs"] }
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
anyhow = "1"
clap = { version = "=4.5.20", features = ["derive"] }
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.41", default-features = false, features = ["formatting", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
