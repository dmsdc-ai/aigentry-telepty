name: Regression Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    # Belt against a hung test never exiting (#645): green mac/ubuntu runs finish in ~2min,
    # so a 20min cap fails a hang fast instead of burning the 6h job ceiling. This is a
    # backstop, NOT the fix — the root cause (undisposed state-machine poll timer holding the
    # test worker open) is fixed in test/submit-gate-restore-register-678.test.js.
    timeout-minutes: 20
    # telepty #879: windows-latest is a release gate like ubuntu/macOS. The former #577
    # continue-on-error quarantine hid that `npm run test:ci` never started on Windows.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      # Task 1215: the Darwin authority-file reader is a bundled native binary. Build it from the
      # first-party source with the runner's own Apple toolchain and Node-API headers BEFORE the suite,
      # so test/authority-file-darwin-1215.test.js exercises the real native reader (it fails, never
      # skips, when the binary is absent). Nothing is downloaded and no npm lifecycle compiles it.
      - name: Build the bundled Darwin authority reader (task 1215)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"
          node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"
      - name: Run regression suite
        run: npm run test:ci
      # #768: this one file drives a real daemon + a real `telepty allow` bridge + a real PTY
      # with a deliberately delayed WS handshake. Inside the parallel list it lands on a worker
      # alongside whatever else node --test schedules there, and on the 3-core macOS runner that
      # pairing pushed test/enforce-report.test.js:359 from 1.2s to its 10s ceiling — a test that
      # only waits for a bus event and loses nothing, so the honest fix is to stop contending
      # rather than to raise its budget. Measured: dropping this file from the parallel list
      # restores macOS to green (run 30204629841). `npm test` still includes it; a dev machine
      # has the cores. Give it its own step so it runs alone and gates just the same.
      - name: Run PTY-serialized regression tests
        run: npm run test:ci:pty
      - name: Check packaged consumer
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: node scripts/check-package.mjs
