# Task 1215 probe529 — NONSHIPPING paired Linux diagnostic (manual only). This file replaces test-install.yml ONLY on a dedicated
# diagnostic branch (never PR143). Each job measures the fixed OLD and NEW public sources, each in its own detached worktree, with
# the SAME two diagnostic test overlays taken from this commit (only those two paths change). Complete records mean
# MEASUREMENT-COMPLETE, never application acceptance; any missing record, identity mismatch or timeout is INCOMPLETE = FAIL.
name: Linux paired probe 1215 (NONSHIPPING)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: paired probe (ubuntu, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, '26.13.0']
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.node == '26.13.0' && 20 || 4 }}
    env:
      NODE_LABEL: ${{ matrix.node }}
      OLD_SHA: 27e4fd1cea7fdb1226c902757ad662f89eac89d8
      OLD_TREE: 6f0bd065189b7789955a384caa84f00b58cc7f87
      NEW_SHA: 301facb531fe857586cc88a17c43939860d84f2d
      NEW_TREE: 010f2600e5414312c64dede9491e94e28ff3e7f1
      COOP_BLOB: d20c3350c99394a9b6f0204dc5caafce3bbde398
      UDS_BLOB: 89aeb8423f628d696c4f357813b6aa293f2edc97
      A_PATTERN: '^actual cooperative handoff waits for owned child exit'
      U_PATTERN: '^UDS oversize:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Prepare paired sources (identity, overlay, npm ci)
        id: prepare
        shell: bash
        run: |
          set -uo pipefail
          P="$RUNNER_TEMP/probe529"; mkdir -p "$P/overlay" "$P/out"
          printf 'kind\tsource\titeration\trc\telapsed_ms\tok\tnot_ok\tdiag\n' > "$P/out/summary.tsv"
          cp test/cooperative-handoff.test.js test/uds-delivery-uncertainty.test.js "$P/overlay/" || exit 1
          echo "probe_commit=$(git rev-parse HEAD) overlay_coop=$(git hash-object "$P/overlay/cooperative-handoff.test.js") overlay_uds=$(git hash-object "$P/overlay/uds-delivery-uncertainty.test.js") node=$(node -v) npm=$(npm -v)" | tee "$P/out/identity.txt"
          for src in old new; do
            if [ "$src" = old ]; then sha=$OLD_SHA; tree=$OLD_TREE; else sha=$NEW_SHA; tree=$NEW_TREE; fi
            git fetch --no-tags --depth=1 origin "$sha" || { echo "::error::fetch $src failed"; exit 1; }
            git worktree add --detach "$P/$src" "$sha" || exit 1
            got_sha=$(git -C "$P/$src" rev-parse HEAD); got_tree=$(git -C "$P/$src" rev-parse 'HEAD^{tree}')
            { [ "$got_sha" = "$sha" ] && [ "$got_tree" = "$tree" ]; } || { echo "::error::$src identity mismatch"; exit 1; }
            { [ "$(git -C "$P/$src" hash-object test/cooperative-handoff.test.js)" = "$COOP_BLOB" ] \
              && [ "$(git -C "$P/$src" hash-object test/uds-delivery-uncertainty.test.js)" = "$UDS_BLOB" ]; } \
              || { echo "::error::$src original test blobs differ"; exit 1; }
            cp "$P/overlay/cooperative-handoff.test.js" "$P/overlay/uds-delivery-uncertainty.test.js" "$P/$src/test/" || exit 1
            changed=$(git -C "$P/$src" status --porcelain | sort | tr '\n' ';')
            [ "$changed" = " M test/cooperative-handoff.test.js; M test/uds-delivery-uncertainty.test.js;" ] \
              || { echo "::error::$src unexpected tracked change: $changed"; exit 1; }
            echo "$src sha=$got_sha tree=$got_tree original_blobs_ok=1 overlay_applied=1" | tee -a "$P/out/identity.txt"
            (cd "$P/$src" && npm ci) > "$P/out/$src-npm-ci.txt" 2>&1 || { echo "::error::npm ci $src failed"; exit 1; }
          done
      # Shared recorder: expected nonzero test exits are RECORDED (set +e), never hidden; completeness is checked by the verdict.
      - name: Measure A (cooperative handoff x3 per source)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: ${{ matrix.node == '26.13.0' && 4 || 2 }}
        shell: bash
        env:
          KIND: A
          ITERATIONS: '3'
          FILE: test/cooperative-handoff.test.js
        run: |
          set -uo pipefail
          set +e
          P="$RUNNER_TEMP/probe529"; if [ "$KIND" = A ]; then pat="$A_PATTERN"; name='actual cooperative handoff waits for owned child exit'; else pat="$U_PATTERN"; name='UDS oversize:'; fi
          for src in old new; do for i in $(seq 1 "$ITERATIONS"); do
            out="$P/out/$KIND-$src-$i.tap"; t0=$(date +%s%3N)
            (cd "$P/$src" && node --require ./test-support/setup-env.js --test --test-reporter=tap --test-name-pattern="$pat" "$FILE") > "$out" 2>&1
            rc=$?; ms=$(( $(date +%s%3N) - t0 ))
            ok=$(grep -E "^ *ok [0-9]+ - $name" "$out" | grep -vc '# SKIP'); nok=$(grep -cE "^ *not ok [0-9]+ - $name" "$out"); diag=$(grep -c "telepty-diag\] $KIND" "$out")
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$KIND" "$src" "$i" "$rc" "$ms" "$ok" "$nok" "$diag" | tee -a "$P/out/summary.tsv"
          done; done
          exit 0
      - name: Measure UDS oversize x3 per source (Node 26.13.0 only)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && matrix.node == '26.13.0' }}
        timeout-minutes: 2
        shell: bash
        env:
          KIND: UDS
          ITERATIONS: '3'
          FILE: test/uds-delivery-uncertainty.test.js
        run: |
          set -uo pipefail
          set +e
          P="$RUNNER_TEMP/probe529"; if [ "$KIND" = A ]; then pat="$A_PATTERN"; name='actual cooperative handoff waits for owned child exit'; else pat="$U_PATTERN"; name='UDS oversize:'; fi
          for src in old new; do for i in $(seq 1 "$ITERATIONS"); do
            out="$P/out/$KIND-$src-$i.tap"; t0=$(date +%s%3N)
            (cd "$P/$src" && node --require ./test-support/setup-env.js --test --test-reporter=tap --test-name-pattern="$pat" "$FILE") > "$out" 2>&1
            rc=$?; ms=$(( $(date +%s%3N) - t0 ))
            ok=$(grep -E "^ *ok [0-9]+ - $name" "$out" | grep -vc '# SKIP'); nok=$(grep -cE "^ *not ok [0-9]+ - $name" "$out"); diag=$(grep -c "telepty-diag\] $KIND" "$out")
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$KIND" "$src" "$i" "$rc" "$ms" "$ok" "$nok" "$diag" | tee -a "$P/out/summary.tsv"
          done; done
          exit 0
      - name: Full unchanged npm run test:ci (old, Node 26.13.0 only)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && matrix.node == '26.13.0' }}
        timeout-minutes: 8
        shell: bash
        env:
          SRC: old
        run: |
          set -uo pipefail
          set +e
          P="$RUNNER_TEMP/probe529"; t0=$(date +%s%3N)
          (cd "$P/$SRC" && npm run test:ci) > "$P/out/FULL-$SRC.txt" 2>&1
          rc=$?; ms=$(( $(date +%s%3N) - t0 ))
          printf 'FULL\t%s\t1\t%s\t%s\t-\t-\t-\n' "$SRC" "$rc" "$ms" | tee -a "$P/out/summary.tsv"
          exit 0
      - name: Full unchanged npm run test:ci (new, Node 26.13.0 only)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && matrix.node == '26.13.0' }}
        timeout-minutes: 8
        shell: bash
        env:
          SRC: new
        run: |
          set -uo pipefail
          set +e
          P="$RUNNER_TEMP/probe529"; t0=$(date +%s%3N)
          (cd "$P/$SRC" && npm run test:ci) > "$P/out/FULL-$SRC.txt" 2>&1
          rc=$?; ms=$(( $(date +%s%3N) - t0 ))
          printf 'FULL\t%s\t1\t%s\t%s\t-\t-\t-\n' "$SRC" "$rc" "$ms" | tee -a "$P/out/summary.tsv"
          exit 0
      - name: Probe verdict (measurement completeness, NOT acceptance)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          set +e
          P="$RUNNER_TEMP/probe529"; S="$P/out/summary.tsv"; bad=0
          [ "$(grep -c ' original_blobs_ok=1 overlay_applied=1' "$P/out/identity.txt" 2>/dev/null)" = 2 ] || { echo "identity/overlay record incomplete"; bad=1; }
          rows() { awk -F'\t' -v k="$1" '$1==k && $4!="" && ($6+$7)==1 && $8>=1' "$S" 2>/dev/null | wc -l | tr -d ' '; }
          full=$(awk -F'\t' '$1=="FULL" && $4!=""' "$S" 2>/dev/null | wc -l | tr -d ' ')
          wa=6; wu=0; wf=0; [ "$NODE_LABEL" = '26.13.0' ] && { wu=6; wf=2; }
          echo "A complete=$(rows A)/$wa UDS complete=$(rows UDS)/$wu FULL recorded=$full/$wf" | tee "$P/out/verdict.txt"
          { [ "$(rows A)" = "$wa" ] && [ "$(rows UDS)" = "$wu" ] && [ "$full" = "$wf" ]; } || bad=1
          # 530: a FULL row counts only with ONE complete spec summary (fixed test count, cancelled 0, pass+fail+skipped=tests,
          # rc 0/1); targeted UDS-oversize data must exist; each source tree must still hold ONLY the two identical overlays.
          sumv() { sed -E 's/\x1b\[[0-9;]*m//g' "$1" 2>/dev/null | awk -v k="$2" '($1=="ℹ" || $1=="#") && $2==k {print $3}'; }
          num() { [[ "$1" =~ ^[0-9]+$ ]]; }
          for src in old new; do
            if [ "$NODE_LABEL" = '26.13.0' ]; then
              f="$P/out/FULL-$src.txt"; want=3171; [ "$src" = new ] && want=3178
              rc=$(awk -F'\t' -v s="$src" '$1=="FULL" && $2==s {print $4}' "$S" 2>/dev/null)
              t=$(sumv "$f" tests); ps=$(sumv "$f" pass); fl=$(sumv "$f" fail); ca=$(sumv "$f" cancelled); sk=$(sumv "$f" skipped)
              echo "FULL $src rc=$rc tests=$t pass=$ps fail=$fl cancelled=$ca skipped=$sk want=$want" | tee -a "$P/out/verdict.txt"
              { [ -s "$f" ] && num "$t" && num "$ps" && num "$fl" && num "$ca" && num "$sk" && [ "$t" = "$want" ] && [ "$ca" = 0 ] \
                && [ "$((ps + fl + sk))" = "$t" ] && { [ "$rc" = 0 ] || [ "$rc" = 1 ]; }; } || { echo "FULL $src INCOMPLETE"; bad=1; }
              # 531: both target records must come from THIS source's FULL log, not from another (filtered) iteration.
              grep -qE 'telepty-diag\] UDS .{0,8}mode.{0,6}oversize' "$f" \
                || { echo "UDS oversize record missing in FULL $src"; bad=1; }
              grep -qF '[telepty-diag] A ' "$f" || { echo "A record missing in FULL $src"; bad=1; }
            fi
            { [ "$(git -C "$P/$src" status --porcelain --untracked-files=no 2>/dev/null | sort | tr '\n' ';')" \
                = " M test/cooperative-handoff.test.js; M test/uds-delivery-uncertainty.test.js;" ] \
              && cmp -s "$P/overlay/cooperative-handoff.test.js" "$P/$src/test/cooperative-handoff.test.js" \
              && cmp -s "$P/overlay/uds-delivery-uncertainty.test.js" "$P/$src/test/uds-delivery-uncertainty.test.js"; } \
              || { echo "$src source tree changed after measurement"; bad=1; }
          done
          [ "$bad" = 0 ] && echo "MEASUREMENT COMPLETE (not acceptance)" | tee -a "$P/out/verdict.txt" || echo "INCOMPLETE = FAIL" | tee -a "$P/out/verdict.txt"
          exit "$bad"
      - name: Upload probe records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe529-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe529/out
          if-no-files-found: error
          retention-days: 7
