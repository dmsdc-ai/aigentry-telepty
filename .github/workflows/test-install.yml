name: Task1272 targeted profile corrections (non-shipping)

# CI-only overlay of the existing test-install.yml on a dedicated branch.
# The measured checkout is the exact candidate/base source, not this overlay.
# No full suite, release, tag, repository write, secret or live-host operation.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact public server710 source commit
        required: true
        type: string
      candidate_tree:
        description: Exact server710 source tree
        required: true
        type: string

permissions:
  contents: read

jobs:
  targeted-posix:
    name: targeted (${{ matrix.os }}, Node26.13.0)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_TREE: ${{ inputs.candidate_tree }}
    steps:
      - name: Validate immutable input shapes before checkout
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
      - name: Record exact source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          mkdir -p "$RUNNER_TEMP/profile716"
          {
            echo 'task1272/server710; targeted execution, not full regression or publication'
            git rev-parse HEAD 'HEAD^{tree}'
            node --version
            npm --version
            git status --porcelain
            git ls-files --stage src/principal/native/prebuilt/darwin test/client-profile-daemon.test.js test/package-version-hotfix-1215.test.js test/release-version-invariant-844.test.js scripts/check-package.mjs
          } | tee "$RUNNER_TEMP/profile716/identity-before.txt"
      - name: Install dependencies (maintained npm ci)
        run: npm ci
      - name: Build the bundled Darwin authority reader (maintained step)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"
          node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"
      - name: Run existing profile and version files once
        shell: bash
        run: |
          set +e
          node --require ./test-support/setup-env.js --test --test-reporter=spec test/client-profile-daemon.test.js test/package-version-hotfix-1215.test.js test/release-version-invariant-844.test.js 2>&1 | tee "$RUNNER_TEMP/profile716/tests.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/profile716/tests.exit"
          exit "$result"
      - name: Check the exact candidate package (maintained pack-only contract)
        shell: bash
        run: |
          set +e
          node scripts/check-package.mjs --pack-only --out "$RUNNER_TEMP/profile716/pack" 2>&1 | tee "$RUNNER_TEMP/profile716/pack.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/profile716/pack.exit"
          exit "$result"
      - name: Preserve post-build checkout state
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/profile716"
          git status --porcelain > "$RUNNER_TEMP/profile716/status-after.txt"
          git ls-files --stage src/principal/native/prebuilt/darwin > "$RUNNER_TEMP/profile716/native-index-after.txt"
      - name: Upload all finite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile716-posix-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile716
          if-no-files-found: error
          retention-days: 7

  windows-ab:
    name: Windows A-B (${{ matrix.source }}, Node${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '26.13.0']
        source: [baseline, candidate]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_TREE: ${{ inputs.candidate_tree }}
      MEASURED_SHA: ${{ matrix.source == 'baseline' && 'c905e85ee065e55aeff4b51494f07c825b433f99' || inputs.candidate_sha }}
      MEASURED_SOURCE: ${{ matrix.source }}
    steps:
      - name: Validate immutable input shapes before checkout
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$MEASURED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEASURED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record measured source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MEASURED_SHA"
          if [ "$MEASURED_SOURCE" = candidate ]; then test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"; fi
          mkdir -p "$RUNNER_TEMP/profile716"
          {
            echo "task1272; Windows isolated two-file A/B; source=$MEASURED_SOURCE"
            echo 'A pass is not evidence against full-suite load interaction.'
            git rev-parse HEAD 'HEAD^{tree}'
            node --version
            npm --version
            git status --porcelain
            git ls-files --stage test/ledger-restore-lifecycle-1207.test.js test/observation-tracking-endpoint-60.test.js test-support/daemon-harness.js
          } | tee "$RUNNER_TEMP/profile716/identity.txt"
      - name: Install dependencies (maintained npm ci)
        run: npm ci
      - name: Start existing Windows load observer (diagnostic only)
        continue-on-error: true
        run: node scripts/windows-load-observer-879.mjs start --out "${{ runner.temp }}/profile716/load-observer"
      - name: Run the exact two existing Windows files once
        shell: bash
        run: |
          set +e
          node --require ./test-support/setup-env.js --test --test-reporter=spec test/ledger-restore-lifecycle-1207.test.js test/observation-tracking-endpoint-60.test.js 2>&1 | tee "$RUNNER_TEMP/profile716/tests.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/profile716/tests.exit"
          exit "$result"
      - name: Stop the existing observer (diagnostic only)
        if: always()
        continue-on-error: true
        run: node scripts/windows-load-observer-879.mjs stop --out "${{ runner.temp }}/profile716/load-observer"
      - name: Upload all finite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile716-windows-${{ matrix.source }}-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile716
          if-no-files-found: error
          retention-days: 7
