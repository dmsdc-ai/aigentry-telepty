name: Task1272 unmodified remaining native acceptance
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-latest
        node:
        - 20
        - 26.13.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 6eebf71a574551cfa5c35fc3d017b45d6b94b029
        persist-credentials: false
    - name: Verify the exact unmodified product checkout
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 6eebf71a574551cfa5c35fc3d017b45d6b94b029

        test "$(git rev-parse ''HEAD^{tree}'')" = 2307c1a3b6650b1d14cf1bc54bf867392b0abe01

        test -z "$(git status --porcelain)"

        git rev-parse HEAD ''HEAD^{tree}''

        '
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run typecheck
      run: npm run typecheck
    - name: Build the bundled Darwin authority reader (task 1215)
      if: runner.os == 'macOS'
      run: 'set -euo pipefail

        NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"

        node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"

        '
    - name: lock525 RED/GREEN witness (Linux, Node 26.13.0)
      if: runner.os == 'Linux' && matrix.node == '26.13.0'
      timeout-minutes: 2
      shell: bash
      run: "set -uo pipefail\nset +e   # GitHub runs bash with -e; the expected OLD rc 1 and no-match greps must be captured, every\
        \ check stays explicit\nW=\"$RUNNER_TEMP/lock525-witness\"; LOCK=src/mailbox/lock.js; mkdir -p \"$W\"\nOLD_COMMIT=27e4fd1cea7fdb1226c902757ad662f89eac89d8;\
        \ OLD_BLOB=a9ce9d7a7e8f062df35777f931107ba6ebaa4f47\ncp -p \"$LOCK\" \"$W/current-lock.js\" || exit 1\ntrap 'cp -p \"$W/current-lock.js\"\
        \ \"$LOCK\"' EXIT INT TERM\nCUR_BLOB=$(git hash-object \"$LOCK\") || exit 1\necho \"head=$(git rev-parse HEAD) current_lock_blob=$CUR_BLOB\
        \ old_commit=$OLD_COMMIT old_lock_blob=$OLD_BLOB\" | tee \"$W/summary.txt\"\ngit fetch --no-tags --depth=1 origin \"$OLD_COMMIT\"\
        \ || { echo \"::error::fetch of $OLD_COMMIT failed\"; exit 1; }\n[ \"$(git rev-parse \"$OLD_COMMIT:$LOCK\")\" = \"$OLD_BLOB\"\
        \ ] || { echo \"::error::old lock blob mismatch\"; exit 1; }\ngit cat-file blob \"$OLD_BLOB\" > \"$LOCK\" && [ \"$(git hash-object\
        \ \"$LOCK\")\" = \"$OLD_BLOB\" ] || { echo \"::error::old lock not in place\"; exit 1; }\nrun() {   # $1 label: the identical\
        \ command for both runs; rc and TAP kept\n  node --require ./test-support/setup-env.js --test --test-reporter=tap --test-name-pattern='^lock525\
        \ ' \\\n    test/mailbox-lock-concurrency.test.js > \"$W/$1.tap\" 2>&1\n  echo $? > \"$W/$1.rc\"\n}\nletters() {   # $1 label,\
        \ $2 'ok' | 'not ok': matching case letters, sorted, no SKIP/TODO lines\n  grep -E \"^ *$2 [0-9]+ - lock525 \\([a-f]\\)\" \"\
        $W/$1.tap\" | grep -vE '# (SKIP|TODO)' \\\n    | sed -E 's/.* - lock525 \\(([a-f])\\).*/\\1/' | sort | tr -d '\\n'\n}\nstorage()\
        \ {   # $1 label: letters of not-ok cases whose own TAP block names MAILBOX_LOCK_STORAGE\n  awk '/^ *(not )?ok [0-9]+ - /{cur=\"\
        \"; if (match($0, /^ *not ok [0-9]+ - lock525 \\([a-f]\\)/)) cur=substr($0, RLENGTH-1, 1)}\n       cur != \"\" && /MAILBOX_LOCK_STORAGE/\
        \ {seen[cur]=1} END {for (k in seen) print k}' \"$W/$1.tap\" | sort | tr -d '\\n'\n}\nmarks() { grep -cE \"lock525 \\([a-f]\\\
        ).*# (SKIP|TODO)\" \"$W/$1.tap\"; }\nfail=0\nrun old\no=\"rc=$(cat \"$W/old.rc\") notok=$(letters old 'not ok') ok=$(letters\
        \ old ok) storage=$(storage old) marks=$(marks old)\"\necho \"OLD $o\" | tee -a \"$W/summary.txt\"\n[ \"$o\" = \"rc=1 notok=abcd\
        \ ok=ef storage=abcd marks=0\" ] || { echo \"::error::old lock.js did not give the exact RED\"; fail=1; }\ncp -p \"$W/current-lock.js\"\
        \ \"$LOCK\" && cmp -s \"$W/current-lock.js\" \"$LOCK\" && [ \"$(git hash-object \"$LOCK\")\" = \"$CUR_BLOB\" ] \\\n  || { echo\
        \ \"::error::current lock.js not restored\"; exit 1; }\nrun new\nn=\"rc=$(cat \"$W/new.rc\") notok=$(letters new 'not ok') ok=$(letters\
        \ new ok) marks=$(marks new)\"\necho \"NEW $n\" | tee -a \"$W/summary.txt\"\n[ \"$n\" = \"rc=0 notok= ok=abcdef marks=0\" ]\
        \ || { echo \"::error::current lock.js did not give the exact GREEN\"; fail=1; }\n[ -s \"$W/summary.txt\" ] || { echo \"::error::witness\
        \ summary missing\"; fail=1; }\nexit \"$fail\"\n"
    - name: Upload lock525 witness records
      if: always() && runner.os == 'Linux' && matrix.node == '26.13.0'
      uses: actions/upload-artifact@v4
      with:
        name: lock525-witness-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lock525-witness
        if-no-files-found: error
        retention-days: 7
    - name: Start Windows load observer (diagnostic only, task 1215 /
      id: load_observer_start
      if: runner.os == 'Windows'
      continue-on-error: true
      run: node scripts/windows-load-observer-879.mjs start --out "${{ runner.temp }}/windows-load-observer-879" --max-ms 1080000
    - name: Run regression suite
      run: npm run test:ci
    - name: Stop Windows load observer (diagnostic only)
      if: always() && runner.os == 'Windows' && steps.load_observer_start.outcome != 'skipped'
      continue-on-error: true
      run: node scripts/windows-load-observer-879.mjs stop --out "${{ runner.temp }}/windows-load-observer-879"
    - name: Upload Windows load observer evidence (diagnostic only)
      if: always() && runner.os == 'Windows'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: windows-load-observer-879-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/windows-load-observer-879
        if-no-files-found: warn
        retention-days: 14
    - name: Run ledger performance gate (single file, no co-scheduled tests; task 1215)
      env:
        TELEPTY_LEDGER_PERF_GATE: '1'
      run: node --require ./test-support/setup-env.js --test --test-concurrency=1 --test-reporter=spec test/ledger-control-responsiveness-1207.test.js
    - name: Run PTY-serialized regression tests
      run: npm run test:ci:pty
    - name: Check packaged consumer
      run: node scripts/check-package.mjs
    name: Unmodified Windows acceptance (Node ${{ matrix.node }})
  mac26-remaining:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 6eebf71a574551cfa5c35fc3d017b45d6b94b029
        persist-credentials: false
    - name: Verify the exact unmodified product checkout
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 6eebf71a574551cfa5c35fc3d017b45d6b94b029

        test "$(git rev-parse ''HEAD^{tree}'')" = 2307c1a3b6650b1d14cf1bc54bf867392b0abe01

        test -z "$(git status --porcelain)"

        git rev-parse HEAD ''HEAD^{tree}''

        '
    - uses: actions/setup-node@v4
      with:
        node-version: 26.13.0
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build the bundled Darwin authority reader (task 1215)
      if: runner.os == 'macOS'
      run: 'set -euo pipefail

        NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"

        node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"

        '
    - name: Run PTY-serialized regression tests
      run: npm run test:ci:pty
    - name: Check packaged consumer
      run: node scripts/check-package.mjs
    name: Mac26 remaining PTY and installed-consumer checks
