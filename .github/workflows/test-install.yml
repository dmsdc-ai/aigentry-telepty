name: Task1272 paired Windows diagnostic and strict Mac perf supplement

# NONSHIPPING. One base/current Windows26 pair under the maintained full-suite load,
# with the SAME author-owned diagnostic test overlay, plus one exact strict Mac gate.
# No retries, publication, secrets, live host control or relaxed product/test budget.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows-pair:
    name: Windows26 full-load diagnostic (${{ matrix.source }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: baseline
            sha: c905e85ee065e55aeff4b51494f07c825b433f99
            tree: e36f6c32a63b3e82b8674d3a20b3e5f580610ee3
          - source: candidate
            sha: 6eebf71a574551cfa5c35fc3d017b45d6b94b029
            tree: 2307c1a3b6650b1d14cf1bc54bf867392b0abe01
    env:
      MEASURED_SHA: ${{ matrix.sha }}
      MEASURED_TREE: ${{ matrix.tree }}
      MEASURED_SOURCE: ${{ matrix.source }}
      TELEPTY_QUEUE_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Verify source and install the same immutable diagnostic overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = "$MEASURED_SHA"
          test "$(git -C subject rev-parse 'HEAD^{tree}')" = "$MEASURED_TREE"
          test -z "${OBSERVE607:-}"
          FILE=test/inject-barrier-identity-109.test.js
          node -e 'const f=require("node:fs"),c=require("node:crypto");for(const [p,h] of [["subject/"+process.argv[1],"7a284cceda4f555dee236e2924beb3dcb3c606c0fb1b2e4e38e61e81453976e2"],["control/.ci/task1272/diag735.test.js","12d7b22481973a8b009eff7bcd513aff98941e5730daed17a0774811110e4f8f"]]){if(c.createHash("sha256").update(f.readFileSync(p)).digest("hex")!==h)throw Error("fixture identity mismatch "+p)}' "$FILE"
          cp control/.ci/task1272/diag735.test.js "subject/$FILE"
          test "$(git -C subject diff --name-only)" = "$FILE"
          EVIDENCE="$RUNNER_TEMP/server740-$MEASURED_SOURCE"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          {
            echo "task1272; NONSHIPPING diagnostic; one attempt; source=$MEASURED_SOURCE; no performance comparison claim"
            git -C subject rev-parse HEAD 'HEAD^{tree}'
            git -C control rev-parse HEAD 'HEAD^{tree}'
            git -C subject diff --stat
            node --version
            npm --version
          } | tee "$EVIDENCE/identity.txt"
      - name: Install dependencies (maintained npm ci)
        working-directory: subject
        run: npm ci
      - name: Typecheck (maintained command)
        working-directory: subject
        run: npm run typecheck
      - name: Start existing Windows load observer (diagnostic only)
        id: observer
        continue-on-error: true
        working-directory: subject
        run: node scripts/windows-load-observer-879.mjs start --out "${{ runner.temp }}/server740-${{ matrix.source }}/load-observer" --max-ms 1080000
      - name: Run the maintained full regression load once, preserve its original exit
        shell: bash
        working-directory: subject
        run: |
          set +e
          npm run test:ci 2>&1 | tee "$EVIDENCE/full-regression.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$EVIDENCE/full-regression.exit"
          exit "$result"
      - name: Stop existing observer (diagnostic only)
        if: always() && steps.observer.outcome != 'skipped'
        continue-on-error: true
        working-directory: subject
        run: node scripts/windows-load-observer-879.mjs stop --out "${{ runner.temp }}/server740-${{ matrix.source }}/load-observer"
      - name: Preserve exact post-run source diff
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/server740-$MEASURED_SOURCE"
          git -C subject status --porcelain > "$RUNNER_TEMP/server740-$MEASURED_SOURCE/status-after.txt"
          git -C subject diff --stat > "$RUNNER_TEMP/server740-$MEASURED_SOURCE/diff-after.txt"
      - name: Upload all diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server740-windows-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server740-${{ matrix.source }}
          if-no-files-found: error
          retention-days: 7

  mac-perf:
    name: Mac26 strict ledger gate, one isolated supplement
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6eebf71a574551cfa5c35fc3d017b45d6b94b029
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Record exact unchanged measured source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6eebf71a574551cfa5c35fc3d017b45d6b94b029
          test "$(git rev-parse 'HEAD^{tree}')" = 2307c1a3b6650b1d14cf1bc54bf867392b0abe01
          mkdir -p "$RUNNER_TEMP/server740-mac-perf"
          { git rev-parse HEAD 'HEAD^{tree}'; node --version; npm --version; } | tee "$RUNNER_TEMP/server740-mac-perf/identity.txt"
      - name: Install dependencies (maintained npm ci)
        run: npm ci
      - name: Build Darwin authority reader (maintained command)
        shell: bash
        run: |
          set -euo pipefail
          NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"
          node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"
      - name: Same strict eight-test ledger gate, no control or limit changes
        env:
          TELEPTY_LEDGER_PERF_GATE: '1'
        shell: bash
        run: |
          set +e
          node --require ./test-support/setup-env.js --test --test-concurrency=1 --test-reporter=spec test/ledger-control-responsiveness-1207.test.js 2>&1 | tee "$RUNNER_TEMP/server740-mac-perf/strict-ledger.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/server740-mac-perf/strict-ledger.exit"
          exit "$result"
      - name: Upload strict gate evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server740-mac-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server740-mac-perf
          if-no-files-found: error
          retention-days: 7
