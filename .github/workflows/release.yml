name: Release

# telepty #874. A tag push is the only thing that publishes this package.
#
# WHY THIS FILE READS THE WAY IT DOES. The runbook this replaces said "git tag && git push,
# CI publishes". Measured on 2026-08-15: no tag-triggered workflow existed, no `npm publish`
# step existed, and no NPM_TOKEN secret existed. 0.6.19, 0.7.0 and 0.7.1 reached npm by hand
# with no tag at all. Had the tag push been trusted as the publish, npm would have sat on
# 0.7.1 while the release was reported shipped — an output claiming more than it measured,
# which is the exact defect 0.8.0 removed from the daemon.
#
# So the rule here: a green run must mean the version is on npm AND the registry serves the
# bytes this tag builds. Every gate fails loudly; none of them skip into green. A missing
# secret is a failure, not a no-op. A local build agreeing with itself is not evidence — the
# proof steps read back from the registry.
#
# And the corollary #917 had to pay for: A QUARANTINED LEG MUST NEVER BE IN THE PUBLISH `needs`
# GRAPH. `continue-on-error` excuses a job that FAILS; it does not excuse one that is CANCELLED,
# and a job killed by `timeout-minutes` is cancelled, so its dependents skip. Measured on run
# 31921029756 (v0.8.1): every gate that could speak said green, windows was cancelled at the
# 20-minute cap, `publish` was skipped, and npm kept serving 0.8.0 while the tag said otherwise.
# CANCELLED IS NOT GREEN AND IT IS NOT FAILED — it is a third outcome, and only the needs graph
# decides whether it can hold a release hostage. Measure a quarantined platform in its own job.

on:
  push:
    tags: [ 'v*' ]
  # #917: re-run an EXISTING tag without retagging. v0.8.1 published nothing because the
  # windows leg timed out (see the `test` job's #917 note), and a tag-triggered re-run would have
  # re-executed the release.yml AT THAT TAG — the broken one — because a push-tag run resolves
  # its workflow file from the tag's tree. Dispatching from the default branch runs the FIXED
  # file while every checkout below pins the tag's tree, so the bytes published are still the
  # tag's bytes. The tag must already exist and must agree with package.json at that tag; the
  # Gate below is what enforces that, unchanged.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.8.1). Must already exist and agree with package.json at that tag.'
        required: true
        type: string

permissions:
  contents: read

# Two runs for the same tag (a re-run, or a tag force-pushed) must not race each other at
# the registry. Queue instead of cancel: cancelling mid-publish is how you get a half-release.
# Keyed on the RESOLVED tag, not github.ref: a dispatch runs on the default branch, so keying
# on the ref would put a dispatched re-run of v0.8.1 in a different group from the tag push it
# is re-running — the exact race this group exists to prevent.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate 1 + 2, before a single test runner is spun up: the tag must agree with the tree, and
  # the credential must exist. Both are cheap and both are unrecoverable later.
  guard:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.identity.outputs.package }}
      version: ${{ steps.identity.outputs.version }}
      # #917: the resolved tag — kept for naming and release metadata (TAG env, gh release).
      tag: ${{ steps.identity.outputs.tag }}
      # Task 1215 R1: the exact commit this Gate checked out and validated. Every downstream job
      # checks out THIS sha, never the tag name, so a tag moved or re-pushed mid-run cannot hand
      # test/pack/consumer/publish a tree the Gate never validated.
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # test/release-version-invariant-844.test.js ties package.json <-> package-lock.json <->
      # CHANGELOG <-> README together. The tag is the fourth party and no test in the tree can
      # see it, because the tag is not in the tree. This step is that missing assertion.
      #
      # `VERSION` comes from the manifest and the tag only has to AGREE with it. Deriving the
      # version from the tag instead — `git describe`, `git tag --sort=-version:refname | head -1`
      # — is deliberately absent and must stay absent: `v1.0.1` is tagged on this repo (2026-03-10)
      # for a version npm has never published, so tag ranking picks 1.0.1 over the real 0.8.0.
      - name: Tag and package.json must name the same version
        id: identity
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${TAG} asks to publish ${TAG_VERSION}, but package.json in this tree says ${VERSION}. Refusing: publishing here would ship bytes that do not match the tag. Fix package.json (and package-lock.json, CHANGELOG.md, README.md — see test/release-version-invariant-844.test.js), then retag."
            exit 1
          fi
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag ${TAG} agrees with package.json: ${PACKAGE}@${VERSION}"

      # Task 1215 R1: export the validated checkout's commit (the tree the identity check above
      # just read). A full 40-hex sha or the Gate fails; downstream checkouts pin to it.
      - name: Export the validated commit
        id: commit
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve the validated checkout commit (got '${COMMIT}')"; exit 1; }
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "validated commit ${COMMIT}"

      # A workflow that silently no-ops when the secret is absent is green-without-publishing,
      # i.e. the bug this file exists to prevent. The token's value is never printed, only its
      # emptiness is tested.
      - name: NPM_TOKEN must be present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::repository secret NPM_TOKEN is not set. This run cannot publish, so it fails instead of passing. Create an npm automation token with publish rights for ${{ steps.identity.outputs.package }} and add it at Settings > Secrets and variables > Actions > New repository secret, named NPM_TOKEN."
            exit 1
          fi
          echo "NPM_TOKEN is present"

  # Gate 3: the whole suite, not a subset. Job shape is deliberately the same as
  # .github/workflows/test-install.yml (matrix, 20min cap, the four steps) so the release gate and
  # the PR gate cannot drift into measuring different things. Kept as a copy rather than a
  # workflow_call refactor because test-install.yml is out of scope for #874.
  #
  # #917 history: windows-latest used to be a third leg of this matrix under
  # `continue-on-error: ${{ matrix.os == 'windows-latest' }}`. `continue-on-error` excuses a job that
  # FAILS; it does not excuse one that is CANCELLED, and a job killed by `timeout-minutes` is
  # cancelled. Measured on run 31921029756 (v0.8.1): windows cancelled at 20m06 and `publish` was
  # SKIPPED while npm still served 0.8.0. It was then measured in a separate non-gating job.
  #
  # Task 1215 G2: test-install.yml already gates windows-latest with these SAME unchanged commands
  # (npm ci, typecheck, test:ci, test:ci:pty) and no continue-on-error, and Windows is a supported
  # platform of this release. So the release gate measures the same three platforms, and no leg is
  # quarantined: a failed or cancelled leg blocks `publish` (red, never a silent skip into green).
  test:
    name: Full suite
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      # Task 1215: build the bundled Darwin authority reader before the suite so the native test runs
      # against the real binary on the macOS leg (absence fails that test; it never skips into green).
      - name: Build the bundled Darwin authority reader (task 1215)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"
          node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"
      - name: Run regression suite
        run: npm run test:ci
      # #768: this file is deliberately excluded from the parallel list and runs alone. Both
      # steps are required — `test:ci` alone is a subset, and a subset must not gate a publish.
      - name: Run PTY-serialized regression tests
        run: npm run test:ci:pty

  # (#879's former `test-windows` job — measured, not gating, continue-on-error — is folded into the
  # `test` matrix above, as its own comment prescribed once windows completes the unchanged suite.)

  # Task 1215: THE binary that ships. Built once on macOS from the tag's first-party source with the
  # runner's Apple toolchain and Node-API headers (explicit inputs, no download), verified universal
  # (arm64 + x86_64), exercised by the native tests with zero skips, and handed to `pack` with its
  # sha256. `pack` packs exactly these bytes and fails unless the tarball contains them.
  authority-darwin:
    name: Build and verify the Darwin authority reader
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (universal, macOS >= 11, N-API 8)
        id: build
        run: |
          set -euo pipefail
          NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"
          node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"
          BIN=src/principal/native/prebuilt/darwin/authority-darwin.node
          ARCHS="$(lipo -archs "$BIN" | tr ' ' '\n' | sort | tr '\n' ' ')"
          test "$ARCHS" = "arm64 x86_64 " || { echo "::error::unexpected architectures: $ARCHS"; exit 1; }
          echo "sha256=$(shasum -a 256 "$BIN" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Native reader tests must run and pass (only the named Linux-only case may skip)
        run: |
          set -euo pipefail
          node --require ./test-support/setup-env.js --test --test-reporter=tap \
            test/authority-file-darwin-1215.test.js test/operator-supervision-1215.test.js | tee "$RUNNER_TEMP/native.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/native.tap"
          # Task 1215 package76: reconcile the TAP against the EXACT expected test list. The former `grep -qx '# skip 0'`
          # could never match: node's TAP summary field is `# skipped N`, so it refused every run (hosted run 41252023257,
          # job 124687386887: tests 8, pass 7, fail 0, skipped 1). Exactly ONE skip is permitted, and only by name: the Linux
          # descriptor-relative reader case, which test/authority-file-darwin-1215.test.js declares
          # `skip: process.platform !== 'linux'` and which the Linux leg of the main suite (test:ci) runs and asserts. On this
          # macOS job that is a platform exclusion of a NON-native Linux test, not a skipped native acceptance: both Darwin
          # native-reader cases and all five operator cases must be reported `ok` with no directive, and any missing, extra,
          # failed, cancelled, todo or other skipped test, or an absent/malformed plan or summary, fails this step.
          node -e '
            const fs = require("fs");
            const EXPECTED = [
              "Darwin: the bundled native reader loads, returns a normal private file and refuses unsafe shapes",
              "Darwin: the real strict trust/client loaders read through the native reader",
              "Linux: the descriptor-relative reader accepts a normal private file and rejects unsafe shapes and replaced parents",
              "R1 legacy daemon: omitted session headers + the shared host token are admitted but never granted supervision",
              "R1 session bearer is never authority, in legacy or alongside a valid operator signature",
              "R1 forged, stale, replayed, body-mismatched and non-operator principals cannot open a supervised instance",
              "R1 a valid verified operator keeps the feature: capability once, production-shaped bind, modal delivers; bearer-only claim stays guarded",
              "the operator positive path through the REAL trust-file loader (Linux /proc reader, Darwin bundled native reader)",
            ];
            const LINUX_ONLY = EXPECTED[2];
            const fail = (m) => { console.error("::error::native gate: " + m); process.exit(1); };
            const points = [], plans = [], summary = {};
            for (const l of fs.readFileSync(process.argv[1], "utf8").split(/\r?\n/)) {
              let m = l.match(/^(not ok|ok) (\d+) - (.*?)(?: # (SKIP|TODO)\b.*)?$/);
              if (m) { points.push({ ok: m[1] === "ok", n: Number(m[2]), name: m[3].replace(/\\#/g, "#"), directive: m[4] || null }); continue; }
              m = l.match(/^1\.\.(\d+)$/);
              if (m) { plans.push(Number(m[1])); continue; }
              m = l.match(/^# (tests|suites|pass|fail|cancelled|skipped|todo) (\d+)$/);
              if (m) { if (m[1] in summary) fail("duplicate summary field # " + m[1]); summary[m[1]] = Number(m[2]); }
            }
            for (const k of ["tests", "suites", "pass", "fail", "cancelled", "skipped", "todo"]) if (!Number.isInteger(summary[k])) fail("summary field # " + k + " absent or malformed");
            if (plans.length !== 1 || plans[0] !== EXPECTED.length) fail("plan " + JSON.stringify(plans) + " is not exactly 1.." + EXPECTED.length);
            if (summary.tests !== EXPECTED.length || points.length !== EXPECTED.length) fail("registered " + summary.tests + " / reported " + points.length + " != expected " + EXPECTED.length);
            if (summary.suites !== 0 || summary.fail !== 0 || summary.cancelled !== 0 || summary.todo !== 0) fail("suites/fail/cancelled/todo must be 0: " + JSON.stringify(summary));
            if (summary.skipped !== 1 || summary.pass !== EXPECTED.length - 1) fail("expected pass " + (EXPECTED.length - 1) + " and skipped 1: " + JSON.stringify(summary));
            if (summary.pass + summary.fail + summary.cancelled + summary.skipped + summary.todo !== summary.tests) fail("summary counts do not reconcile: " + JSON.stringify(summary));
            points.forEach((p, i) => { if (p.n !== i + 1) fail("test points are not numbered 1.." + points.length); });
            for (const name of EXPECTED) {
              const hits = points.filter((p) => p.name === name);
              if (hits.length !== 1) fail("expected test reported " + hits.length + " times: " + name);
              if (name === LINUX_ONLY) { if (!(hits[0].ok && hits[0].directive === "SKIP")) fail("the only permitted skip is the Linux-only case, as SKIP: " + name); }
              else if (!(hits[0].ok && hits[0].directive === null)) fail("native/operator test did not pass without a directive: " + name);
            }
            const extra = points.filter((p) => !EXPECTED.includes(p.name)).map((p) => p.name);
            if (extra.length) fail("unexpected test(s): " + JSON.stringify(extra));
            console.log("native gate: " + summary.pass + "/" + summary.tests + " passed; the single skip is the Linux-only case (platform exclusion, asserted in the Linux leg of test:ci)");' "$RUNNER_TEMP/native.tap"
      - uses: actions/upload-artifact@v4
        with:
          name: authority-darwin
          path: |
            src/principal/native/prebuilt/darwin/authority-darwin.node
            src/principal/native/prebuilt/darwin/authority-darwin.node.provenance.json
          if-no-files-found: error

  # Task 1215 G2: ONE canonical archive, packed once from the tag's tree AFTER the reviewed Darwin
  # reader is downloaded and verified. check-package --pack-only writes the archive and a manifest
  # read back out of the tarball itself: archive sha256/sha1/integrity, every packed file's
  # path/size/sha256 (npm additions and the release-built reader included) and the reader's exact
  # identity (sha256, bytes, provenance, fat-slice hashes). Every consumer leg AND publish consume
  # this same file. No secret or registry credential is present in this job.
  pack:
    name: Pack the canonical archive
    needs: [guard, authority-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      shasum: ${{ steps.pack.outputs.shasum }}
      integrity: ${{ steps.pack.outputs.integrity }}
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: authority-darwin
          path: src/principal/native/prebuilt/darwin
      - name: The bundled Darwin reader must be the bytes the macOS job built
        env:
          EXPECTED: ${{ needs.authority-darwin.outputs.sha256 }}
        run: |
          set -euo pipefail
          BIN=src/principal/native/prebuilt/darwin/authority-darwin.node
          chmod 0644 "$BIN" "$BIN.provenance.json"
          ACTUAL="$(sha256sum "$BIN" | cut -d' ' -f1)"
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED" || { echo "::error::Darwin reader sha256 $ACTUAL != built $EXPECTED"; exit 1; }

      # `npm pack` does NOT run prepublishOnly (only prepack/prepare), but `npm publish` of a folder
      # does — so the hook runs explicitly here, before the one pack, and publish ships THIS tarball
      # file (a tarball argument is not rebuilt). gen-readme is idempotent.
      - name: Pack once and record the archive manifest
        id: pack
        env:
          EXPECTED: ${{ needs.authority-darwin.outputs.sha256 }}
          OUT: ${{ runner.temp }}/package
        run: |
          set -euo pipefail
          npm run prepublishOnly
          node scripts/check-package.mjs --pack-only --out "$OUT"
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path"), out = process.env.OUT;
            const m = JSON.parse(fs.readFileSync(path.join(out, "package-manifest.json"), "utf8"));
            // Task 1215: the tarball must carry THE built reader, or Mac strict mode cannot read authority files.
            if (m.darwin.sha256 !== process.env.EXPECTED) { console.error("::error::packed Darwin reader " + m.darwin.sha256 + " != built " + process.env.EXPECTED); process.exit(1); }
            const sha = (f) => crypto.createHash("sha256").update(fs.readFileSync(path.join(out, f))).digest("hex");
            if (sha(m.filename) !== m.sha256) { console.error("::error::archive sha256 differs from its manifest"); process.exit(1); }
            const lines = ["filename=" + m.filename, "sha256=" + m.sha256, "shasum=" + m.shasum, "integrity=" + m.integrity, "manifest_sha256=" + sha("package-manifest.json")];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
            console.log("packed " + m.filename + " sha256=" + m.sha256 + " sha1=" + m.shasum + " files=" + m.files.length);'
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            ${{ runner.temp }}/package/${{ steps.pack.outputs.filename }}
            ${{ runner.temp }}/package/package-manifest.json
          if-no-files-found: error

  # Task 1215 G2: the SAME archive installed as a private non-global consumer on every supported OS
  # BEFORE anything is published: manifest and membership checked before install, npm ls identity,
  # bins, --version/--help/init, the macOS installed native authority read, and an installed daemon +
  # PTY smoke. No secret or registry credential is present in this job.
  consumer:
    name: Installed consumer (${{ matrix.os }})
    needs: [guard, pack]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: The downloaded archive and manifest must be the pack job's bytes
        shell: bash
        env:
          DIR: ${{ runner.temp }}/package
          FILENAME: ${{ needs.pack.outputs.filename }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
          MANIFEST_SHA256: ${{ needs.pack.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path"), e = process.env;
            const sha = (f) => crypto.createHash("sha256").update(fs.readFileSync(path.join(e.DIR, f))).digest("hex");
            if (sha(e.FILENAME) !== e.SHA256 || sha("package-manifest.json") !== e.MANIFEST_SHA256) { console.error("::error::downloaded package bytes differ from the pack job"); process.exit(1); }
            console.log("archive " + e.FILENAME + " sha256=" + e.SHA256);'
      - name: Validate the installed consumer of that archive
        shell: bash
        env:
          DIR: ${{ runner.temp }}/package
          FILENAME: ${{ needs.pack.outputs.filename }}
        run: node scripts/check-package.mjs --tarball "$DIR/$FILENAME" --manifest "$DIR/package-manifest.json"

  publish:
    name: Publish and verify from the registry
    needs: [guard, test, authority-darwin, pack, consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    env:
      PACKAGE: ${{ needs.guard.outputs.package }}
      VERSION: ${{ needs.guard.outputs.version }}
      # #917: the tag the Gate resolved and validated, not github.ref_name — on a dispatched
      # re-run the ref is the default branch and the tag is the input.
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package

      # Task 1215 G2: publish the pack job's archive — the bytes every consumer leg installed — and
      # never repack. Re-hashed here (sha256 and the sha1 the registry readback compares);
      # `steps.pack.outputs.tarball/shasum` keep the names the steps below already use.
      - name: The archive to publish must be the pack job's bytes
        id: pack
        env:
          DIR: ${{ runner.temp }}/package
          FILENAME: ${{ needs.pack.outputs.filename }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
          SHASUM: ${{ needs.pack.outputs.shasum }}
        run: |
          set -euo pipefail
          TARBALL="${DIR}/${FILENAME}"
          test -n "$FILENAME" && test -f "$TARBALL" || { echo "::error::the pack artifact lacks ${FILENAME}"; exit 1; }
          test "$(sha256sum "$TARBALL" | cut -d' ' -f1)" = "$SHA256" || { echo "::error::archive sha256 differs from the pack job"; exit 1; }
          test "$(sha1sum "$TARBALL" | cut -d' ' -f1)" = "$SHASUM" || { echo "::error::archive sha1 differs from the pack job"; exit 1; }
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "shasum=${SHASUM}" >> "$GITHUB_OUTPUT"
          echo "publishing the pack job archive ${FILENAME} sha256=${SHA256} sha1=${SHASUM}"

      # Idempotence. npm versions are immutable, so a re-run or a twice-pushed tag must not try
      # to publish again. It must also not shrug and go green: "already there" is only
      # acceptable if what is already there is what this tag builds — the shasum step below
      # proves that either way. A 404 means not published; anything else (network, auth, outage)
      # is an unknown answer and an unknown answer fails rather than guessing "not published".
      - name: Ask the registry whether this version already exists
        id: registry
        run: |
          set -euo pipefail
          set +e
          REMOTE="$(npm view --prefer-online "${PACKAGE}@${VERSION}" dist.shasum 2>"${RUNNER_TEMP}/view.err")"
          RC=$?
          set -e
          if [ "$RC" -eq 0 ] && [ -n "$REMOTE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} is already on npm (sha1=${REMOTE}); this run will verify it rather than republish"
          elif grep -q 'E404' "${RUNNER_TEMP}/view.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} is not on npm yet"
          else
            cat "${RUNNER_TEMP}/view.err"
            echo "::error::could not determine whether ${PACKAGE}@${VERSION} is on the registry. Refusing to publish on an unknown answer."
            exit 1
          fi

      # DATED DEBT — #876. This authenticates with a granular access token by choice, for one
      # release: `release.yml` has never executed, and an unrehearsed OIDC exchange in the same
      # first run would leave a failure with two candidate causes and no way to separate them.
      # One unverified variable at a time.
      #
      # It is not a steady state. npm's Phase 2 (targeted January 2027) removes direct publishing
      # from the bypass-2FA token variant CI needs; Phase 1 is already enforced — `npm profile get`
      # returns 403 on this account today. The migration is trusted publishing (OIDC), which needs
      # npm >= 11.5.1 and therefore `node-version: 24`. Do NOT reach for node 22 on the strength of
      # npm's "Node 22.14.0 or higher" line: node 22 ships npm 10.9.8, has no OIDC, and says nothing.
      # #1127: `id` so the step below can name PUBLISH_FAILED specifically. And the condition
      # here is what makes the existing-tag re-run a REMEDY rather than a second publish —
      # measured on run 34129124454 (the v0.8.2 dispatch re-run): this step reported `skipped`
      # and every step below it still reported `success`. `skipped` is not `failure`, so the
      # steps below carry NO `if:` and all run on the already-published path. Do not add a
      # condition to any step below this one; that is precisely what would break the remedy.
      - name: Publish to npm
        id: publish
        if: steps.registry.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public

      # #1127, third outcome. A red run has two causes that demand opposite responses, and the
      # 0.8.2 release proved a reader cannot tell them apart from the badge. This step speaks
      # for exactly one of them: npm REJECTED the publish, so nothing was shipped.
      - name: Name the outcome when the publish itself failed
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          set -euo pipefail
          {
            echo "### Registry proof — \`${PACKAGE}@${VERSION}\`"
            echo
            echo "**PUBLISH_FAILED** — \`npm publish\` was rejected, so ${VERSION} never reached the registry. Nothing was shipped; the publish step's own error says why. Fixing that cause and re-running is safe: there is no published version to collide with."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISH_FAILED: npm publish was rejected; ${PACKAGE}@${VERSION} was not shipped."

      # The verification that matters. A local build agreeing with itself proves nothing about
      # what users download. This reads the shasum back from the registry and compares it to the
      # tarball we packed. It runs on the fresh-publish path AND the already-published path, so
      # a green run always states the same true thing: npm serves these bytes.
      #
      # #1127 — WHY THE BUDGET IS 15 MINUTES AND WHY IT READS THE PACKUMENT. On 2026-09-07 the
      # 0.8.2 publish SUCCEEDED, npm replied "being processed and may take a few minutes", and
      # this step's 6 x 10 s = 60 s ran out. The version became readable 3 m 09 s after publish
      # (packument time 13:42:16Z, publish ~13:39). The run went red, steps 9 and 10 skipped, and
      # a finished release looked like a failed one. The gate is right — a green badge is not the
      # proof, the registry's bytes are — but its budget was shorter than npm's own asynchronous
      # processing, and A RED BADGE IS NOT PROOF OF FAILURE EITHER unless the step says which
      # failure it is. So: 25 attempts spanning 900 s (attempt 1 immediately, then 10 s x6,
      # 30 s x8, 60 s x10 = 15 min of waiting), and the read is a plain HTTP GET of the packument
      # rather than `npm view`, which can answer from a local cache that has nothing to do with
      # what the registry is serving.
      - name: The registry must serve the bytes we packed
        run: |
          set -euo pipefail
          LOCAL="${{ steps.pack.outputs.shasum }}"
          export PACKUMENT="${RUNNER_TEMP}/packument.json"
          REMOTE=""
          ATTEMPT=0
          # The wait BEFORE each attempt; 0 means "read immediately". 24 waits = 900 s total.
          for WAIT in 0 10 10 10 10 10 10 30 30 30 30 30 30 30 30 60 60 60 60 60 60 60 60 60 60; do
            if [ "$WAIT" -gt 0 ]; then
              echo "registry has not surfaced ${VERSION} yet (attempt ${ATTEMPT}/25); waiting ${WAIT}s"
              sleep "$WAIT"
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if curl -fsSL -H 'Cache-Control: no-cache' "https://registry.npmjs.org/${PACKAGE}" -o "$PACKUMENT"; then
              # readFileSync, not require: require() caches by path and would keep serving the
              # first (empty) answer for every later attempt.
              REMOTE="$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.env.PACKUMENT,"utf8"));const v=(d.versions||{})[process.env.VERSION];process.stdout.write((v&&v.dist&&v.dist.shasum)||"")' || true)"
            fi
            [ -n "$REMOTE" ] && break
          done
          if [ -z "$REMOTE" ]; then
            {
              echo "### Registry proof — \`${PACKAGE}@${VERSION}\`"
              echo
              echo "**PUBLISHED_NOT_YET_READABLE** — npm ACCEPTED the publish; the registry had not surfaced ${VERSION} after 25 reads over 15 minutes. This is npm's asynchronous processing running long, not a failed publish, so this red run does NOT mean nothing shipped."
              echo
              echo "Remedy: once npm serves ${VERSION}, re-run this workflow from the Actions tab (Run workflow) with tag \`${TAG}\`. That run finds the version already present, skips the publish, verifies the bytes, and creates the GitHub Release."
              echo
              echo "NOT the remedy: publishing again, or retagging. npm versions are immutable and this one is already taken by this tag's tarball."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PUBLISHED_NOT_YET_READABLE: ${PACKAGE}@${VERSION} was published but is still not readable from the registry after 25 reads over 15 minutes. The publish was ACCEPTED — do NOT re-publish and do NOT retag. Re-run this workflow for the existing tag ${TAG} once npm serves it; that path skips the publish, verifies the bytes and creates the GitHub Release."
            exit 1
          fi
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::npm serves ${PACKAGE}@${VERSION} with sha1 ${REMOTE}, but this tag packs to ${LOCAL}. The registry's bytes are not this tag's bytes. npm versions are immutable — republish under a new version rather than assuming this is cosmetic."
            exit 1
          fi
          {
            echo "### Registry proof — \`${PACKAGE}@${VERSION}\`"
            echo
            echo "**PUBLISHED_AND_READABLE** — the registry serves sha1 \`${REMOTE}\`, the tarball this tag packs. Read on attempt ${ATTEMPT} of 25."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISHED_AND_READABLE: registry sha1 ${REMOTE} matches the packed tarball (attempt ${ATTEMPT}/25)"

      # Second, independent proof: not the metadata npm reports, but the artifact a user
      # actually gets. Clean temp dir, private npm cache so nothing can be served from an
      # earlier install, and the binary has to say the tag's version out loud.
      - name: A clean install from npm must report the tag's version
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cd "$WORK"
          export npm_config_cache="${WORK}/npm-cache"
          REPORTED="$(npx -y -p "${PACKAGE}@${VERSION}" telepty --version)"
          if [ "$REPORTED" != "$VERSION" ]; then
            echo "::error::installed ${PACKAGE}@${VERSION} from npm and it reports version '${REPORTED}', expected '${VERSION}'."
            exit 1
          fi
          echo "installed from npm in a clean dir; telepty --version reports ${REPORTED}"

      # Only now, with the publish proven, is there something to announce. readme-regen.yml
      # triggers on `release: published` and syncs README.md on main — do not duplicate that
      # here. Notes come from the CHANGELOG section that release-version-invariant-844 already
      # guarantees exists for exactly this version.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; leaving it alone"
            exit 0
          fi
          awk -v v="$VERSION" '$1 == "##" && ($2 == v || $2 == "[" v "]") { p = 1; next } p && /^## / { exit } p' \
            CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}, so there are no release notes to publish. The package IS on npm — fix the CHANGELOG on main and re-run this job."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md"
          echo "created GitHub Release ${TAG}"
