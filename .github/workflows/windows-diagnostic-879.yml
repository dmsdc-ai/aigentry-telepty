name: Task1215 exact-candidate Mac20 PTY-only evidence (NONSHIPPING)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac20-pty:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD: c905e85ee065e55aeff4b51494f07c825b433f99
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c905e85ee065e55aeff4b51494f07c825b433f99
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Record exact unchanged source and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/pty683"
          git rev-parse HEAD > "$RUNNER_TEMP/pty683/source-head.txt"
          node --version > "$RUNNER_TEMP/pty683/node-version.txt"
          npm --version > "$RUNNER_TEMP/pty683/npm-version.txt"
      - name: Install unchanged locked dependencies
        run: npm ci
      - name: Build the existing Darwin authority reader
        shell: bash
        run: |
          set -euo pipefail
          NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"
          node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"
      - name: Run ONLY the maintained serialized PTY suite once
        shell: bash
        run: |
          set -uo pipefail
          npm run test:ci:pty > "$RUNNER_TEMP/pty683/run.log" 2>&1
          RESULT=$?
          printf '%s\n' "$RESULT" > "$RUNNER_TEMP/pty683/exit.txt"
          cat "$RUNNER_TEMP/pty683/run.log"
          exit "$RESULT"
      - name: Preserve exact outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac20-pty683-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pty683
          if-no-files-found: error
          retention-days: 14
