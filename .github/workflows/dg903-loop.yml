# dg903 BRANCH-ONLY diagnostic loop — never merged to main.
#
# Task #903: `idle after an inject emits task_completion_unknown, not a terminal claim`
# (test/enforce-report.test.js) reds on macos-latest at the 60s ceiling in 3/3 full-suite runs
# while ubuntu passes at ~1.4s. Two questions this workflow answers:
#   1. does the red reproduce when the FILE runs alone (environment), or only inside the parallel
#      suite (contention)?
#   2. what does the sender session actually observe on the runner? (the instrumented dump in
#      test/enforce-report.test.js prints the trajectory + daemon log on timeout)
name: dg903 macOS observation loop
on:
  push:
    branches: [ "fix/903-macos-observation-red" ]
  workflow_dispatch:

jobs:
  single-file:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        rep: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Environment fingerprint
        run: |
          node -e "console.log('cores', require('os').availableParallelism(), process.platform, process.arch)"
          which bash; bash --version | head -1
          echo "TERM=$TERM SHELL=$SHELL"
      - name: enforce-report.test.js alone (rep ${{ matrix.rep }})
        run: node --require ./test-support/setup-env.js --test --test-reporter=spec test/enforce-report.test.js

  full-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        rep: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Environment fingerprint
        run: |
          node -e "console.log('cores', require('os').availableParallelism(), process.platform, process.arch)"
          which bash; bash --version | head -1
      - name: Full CI suite (rep ${{ matrix.rep }})
        run: npm run test:ci
