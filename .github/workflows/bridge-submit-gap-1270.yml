name: Bridge submit gap 1270 (RED/GREEN)

# Task 1270 — body→submit ordering floor and stranded-submit custody at the bridge PTY writer
# (src/cli/security-actions.js). TWO focused test files, each in its own node process per phase and OS, on
# the exact PR head, byte-identical (sha256 checked) before and after every run:
#   test/bridge-submit-gap-1270.test.js      — 28 cases: 12 initial controls "1270: …" + 16 later "1270 F…/I…"
#   test/bridge-stranded-submit-1270.test.js —  9 cases: R1/R2 (stranded composer, silent wake exits)
# = 37 runtime cases. Only src/cli/security-actions.js is ever overlaid; the candidate is restored and
# verified before GREEN.
#
#   RED-A — ONE original-defect witness: baseline 1a51d30a… (security-actions blob b2fcf098…, pinned +
#           verified), judged on the 12 initial controls only. Gap file: exit 1, 28 rows, 12 initial, named
#           early-CR case fails and named late-CR control passes, EVERY failing initial control is a pure
#           assertion (testCodeFailure + ERR_ASSERTION, no PRECONDITION). Stranded file: 9 rows, all 9 named
#           titles present, exit consistent with its failures. Both: summary consistent, 0 skipped/cancelled/
#           todo, no module/import/setup/EACCES/EPERM/syntax/timeout error. The other 25 rows (16 later gap
#           rows + 9 R1/R2 rows) are printed as DIAGNOSTICS with status and error code — not hosted R1/R2 or
#           F1/F2/I1 counterfactual proof; rejected only for setup-class signals (PRECONDITION, or a failure
#           that is not testCodeFailure, e.g. a timeout). Failure counts are printed, never pre-asserted.
#   GREEN — restored PR head, both files: exit 0, 28 + 9 = 37 plain ok (all 9 R1/R2 titles named), nothing
#           skipped, cancelled or todo. Runs even when RED-A failed; a failed RED-A still fails the job.
# Counterfactual proofs for F1/F2/I1 and R1/R2 are LOCAL ONLY (recorded outside CI with immutable hashes),
# never a hosted three-OS RED. The tests mark product states "CHECKPOINT:" (ordinary assertions) and setup
# validity "PRECONDITION:". Results are parsed from top-level TAP lines and their own YAML block (exactly
# "  ---" … "  ..."), so diff text inside an error message cannot end a block early.
# Timer/fake-child tests: master-write ORDER/TIMING only — never that a native CLI treats the CR as Enter,
# nor anything about the current Root or a live upgrade.
#
# Security posture: no secrets; read-only token; checkout credentials not persisted; dependencies
# from the frozen lockfile via `npm ci --ignore-scripts`; no publish, no artifact upload, no service
# or live operation.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bridge-submit-gap-1270.yml'
      - 'scripts/test-suites.json'
      - 'src/cli/security-actions.js'
      - 'test/bridge-submit-gap-1270.test.js'
      - 'test/bridge-stranded-submit-1270.test.js'
      - 'test/fixtures/bridge-136/**'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: bridge-submit-gap-1270-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  red-green:
    name: submit gap RED/GREEN (${{ matrix.os }}, node 26.13.0)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      BASELINE_SHA: 1a51d30a81fb0ad5a3e64d363dea72e84151da77
      BASELINE_MODULE_SHA256: b2fcf098f47730dd2dc4171dd2b282eb35534cb6ea13f6407bfaf8a3a768415f
      GAP_TEST: test/bridge-submit-gap-1270.test.js
      GAP_CASES: '28'
      GAP_INITIAL: '12'
      STRANDED_TEST: test/bridge-stranded-submit-1270.test.js
      STRANDED_CASES: '9'
      EARLY_CR_TITLE: '1270: a CR arriving +5 ms after a direct body write is written once, no sooner than 250 ms after that body write'
      LATE_CR_TITLE: '1270: a late CR (gap already elapsed) is written immediately in the same turn'
      # The 9 R1/R2 runtime titles of test/bridge-stranded-submit-1270.test.js (one per line).
      STRANDED_TITLES: |
        R1 modal: CR refused modal_ui at wake; after the modal is answered a later pair adds 0 writes (composer_stranded)
        R1 typing: CR refused user_input_after_body at wake; a later pair is held (composer_stranded), 0 writes
        R1 owner change, same child: CR refused owner_changed; the new owner's pair is held (composer_stranded), 0 writes
        R1 control: child replaced during the hold — CR refused child_replaced; a fresh pair reaches the NEW child exactly once
        R1 derived (unknown): the held CR's write throws (unknown/write_threw); a later pair is held (composer_stranded), never appended
        R1 derived (queued path): typing after the flushed body quarantines its queued CR; a later pair is held (composer_stranded)
        R2 handoff: handoffPending set during the hold — exactly one refused not_written handoff_pending receipt, 0 CR
        R2 close (closeAllowSession during the hold): exactly one refused not_written session_closed receipt, 0 CR
        R2 close (shared closed flag observed at wake, the isClosed() door): exactly one refused not_written session_closed receipt, 0 CR
      TELEPTY_NO_TAILNET_AUTO: '1'
      TELEPTY_SKIP_POSTINSTALL: '1'
      NO_UPDATE_NOTIFIER: '1'
    steps:
      # SHAs as pinned in bridge-contract-1215.yml (actions/checkout v4.2.2, actions/setup-node v4.4.0).
      # Full history so the frozen baseline commit can be read from the same checkout.
      - name: Check out the PR head with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.0'

      - name: Preconditions (exact Node, exact head, exact baseline module)
        id: pre
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha256() { node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$1"; }
          test "$(node --version)" = "v26.13.0"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git show "${BASELINE_SHA}:src/cli/security-actions.js" > "$RUNNER_TEMP/baseline-security-actions.js"
          test "$(sha256 "$RUNNER_TEMP/baseline-security-actions.js")" = "$BASELINE_MODULE_SHA256"
          if cmp -s "$RUNNER_TEMP/baseline-security-actions.js" src/cli/security-actions.js; then
            echo "::error::PR head security-actions.js equals the baseline module; nothing to compare"; exit 1
          fi
          test -f "$GAP_TEST"
          test -f "$STRANDED_TEST"
          test -d test/fixtures/bridge-136
          echo "PR head security-actions.js sha256: $(sha256 src/cli/security-actions.js)"
          echo "PR head $GAP_TEST sha256: $(sha256 "$GAP_TEST")"
          echo "PR head $STRANDED_TEST sha256: $(sha256 "$STRANDED_TEST")"
          test -z "$(git diff --name-only)"
          if git merge-base --is-ancestor "$BASELINE_SHA" HEAD; then echo "baseline is an ancestor of HEAD"; else echo "baseline is NOT an ancestor of HEAD (recorded, not required)"; fi
          echo "preconditions ok"

      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-cache"
          npm ci --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache"

      - name: RED-A — initial controls against the original baseline security-actions.js
        id: red_a
        run: |
          set -euo pipefail
          sha256() { node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$1"; }
          gap_tap="$RUNNER_TEMP/red-a-gap.tap"; str_tap="$RUNNER_TEMP/red-a-stranded.tap"
          gap_tsv="$RUNNER_TEMP/red-a-gap.tsv"; str_tsv="$RUNNER_TEMP/red-a-stranded.tsv"
          gap_sha="$(sha256 "$GAP_TEST")"; str_sha="$(sha256 "$STRANDED_TEST")"
          cp "$RUNNER_TEMP/baseline-security-actions.js" src/cli/security-actions.js
          test "$(sha256 src/cli/security-actions.js)" = "$BASELINE_MODULE_SHA256"
          test "$(git diff --name-only)" = "src/cli/security-actions.js"
          # Actions runs bash with errexit; an `if` condition is exempt, so each expected nonzero exit is
          # captured, then the candidate module is restored before anything is judged.
          if node --require ./test-support/setup-env.js --test --test-concurrency=1 --test-reporter=tap \
            "$GAP_TEST" > "$gap_tap" 2>&1; then gap_rc=0; else gap_rc=$?; fi
          if node --require ./test-support/setup-env.js --test --test-concurrency=1 --test-reporter=tap \
            "$STRANDED_TEST" > "$str_tap" 2>&1; then str_rc=0; else str_rc=$?; fi
          git checkout -- src/cli/security-actions.js
          echo "=== $GAP_TEST"; cat "$gap_tap"; echo "baseline (b2fcf098) $GAP_TEST exit=$gap_rc"
          echo "=== $STRANDED_TEST"; cat "$str_tap"; echo "baseline (b2fcf098) $STRANDED_TEST exit=$str_rc"
          bad=0
          die() { echo "::error::RED-A not proven: $1"; bad=1; }
          test -z "$(git diff --name-only)" || die "candidate source not restored"
          [ "$(sha256 "$GAP_TEST")" = "$gap_sha" ] || die "$GAP_TEST changed during RED-A"
          [ "$(sha256 "$STRANDED_TEST")" = "$str_sha" ] || die "$STRANDED_TEST changed during RED-A"
          # One row per TOP-LEVEL result:
          #   status<TAB>title<TAB>testCodeFailure<TAB>ERR_ASSERTION<TAB>PRECONDITION<TAB>code
          # Keys are read only at the result's own YAML indentation; the block ends only at "  ...".
          parse() {
            awk '
              function flush() { if (st != "") printf "%s\t%s\t%d\t%d\t%d\t%s\n", st, ti, f, e, p, c; st = "" }
              { raw = $0; sub(/\r$/, "", raw) }
              raw ~ /^(not ok|ok) [0-9]+ - / { flush(); st = (raw ~ /^not ok/) ? "not ok" : "ok"; ti = raw
                sub(/^(not ok|ok) [0-9]+ - /, "", ti); f = 0; e = 0; p = 0; c = "-"; y = 0; next }
              st != "" && raw == "  ---" { y = 1; next }
              st != "" && y && raw == "  ..." { y = 0; flush(); next }
              st != "" && y { if (raw ~ /^  failureType: .testCodeFailure.$/) f = 1
                              if (raw ~ /^  code: /) { c = raw; sub(/^  code: /, "", c); gsub(/\047/, "", c) }
                              if (raw ~ /^  code: .ERR_ASSERTION.$/) e = 1
                              if (index(raw, "PRECONDITION") > 0) p = 1 }
              END { flush() }' "$1"
          }
          parse "$gap_tap" > "$gap_tsv"; parse "$str_tap" > "$str_tsv"
          count() { awk -F'\t' "$1" "$2" | awk 'END { print NR }'; }
          echo "--- classification (file | status | group | class | title)"
          for pair in "gap:$gap_tsv" "stranded:$str_tsv"; do
            awk -F'\t' -v file="${pair%%:*}" '{ g = (file == "gap" && $2 ~ /^1270: /) ? "initial" : "later"
              if ($1 == "ok") k = "-"
              else if (g == "initial") k = ($3 == 1 && $4 == 1 && $5 == 0) ? "semantic" : "NOT PURE"
              else if ($5 == 1 || $3 != 1) k = "SETUP-CLASS (rejected)"
              else k = "diagnostic only, not a hosted counterfactual witness (code " $6 ")"
              printf "%s | %s | %s | %s | %s\n", file, $1, g, k, $2 }' "${pair#*:}"
          done
          gap_rows="$(count '1' "$gap_tsv")"; str_rows="$(count '1' "$str_tsv")"
          gap_fails="$(count '$1 == "not ok"' "$gap_tsv")"; str_fails="$(count '$1 == "not ok"' "$str_tsv")"
          initial_rows="$(count '$2 ~ /^1270: /' "$gap_tsv")"
          gap_later_rows="$(count '$2 ~ /^1270 [FI]/' "$gap_tsv")"
          ini_fail="$(count '$1 == "not ok" && $2 ~ /^1270: /' "$gap_tsv")"
          ini_bad="$(count '$1 == "not ok" && $2 ~ /^1270: / && !($3 == 1 && $4 == 1 && $5 == 0)' "$gap_tsv")"
          later_setup="$(( $(count '$1 == "not ok" && $2 ~ /^1270 [FI]/ && ($5 == 1 || $3 != 1)' "$gap_tsv") + $(count '$1 == "not ok" && ($5 == 1 || $3 != 1)' "$str_tsv") ))"
          echo "rows=$((gap_rows + str_rows)) (gap $gap_rows + stranded $str_rows) failures=$((gap_fails + str_fails)) initial_rows=$initial_rows initial_failures=$ini_fail initial_not_pure=$ini_bad later_setup_class=$later_setup (observed, not pre-asserted)"
          [ "$gap_rc" -eq 1 ] || die "$GAP_TEST exit $gap_rc, expected 1"
          if [ "$str_fails" -gt 0 ]; then want_rc=1; else want_rc=0; fi
          [ "$str_rc" -eq "$want_rc" ] || die "$STRANDED_TEST exit $str_rc inconsistent with $str_fails failure(s)"
          [ "$gap_rows" -eq "$GAP_CASES" ] || die "$GAP_TEST: $gap_rows top-level results, expected $GAP_CASES"
          [ "$str_rows" -eq "$STRANDED_CASES" ] || die "$STRANDED_TEST: $str_rows top-level results, expected $STRANDED_CASES"
          [ "$initial_rows" -eq "$GAP_INITIAL" ] || die "$initial_rows initial-control rows, expected $GAP_INITIAL"
          [ "$((initial_rows + gap_later_rows))" -eq "$gap_rows" ] || die "gap rows outside the initial/later title groups"
          [ "$ini_bad" -eq 0 ] || die "$ini_bad initial-control failure(s) are not pure assertion failures"
          [ "$(awk -F'\t' -v t="$EARLY_CR_TITLE" '$2 == t { print $1 "|" $3 $4 $5 }' "$gap_tsv")" = "not ok|110" ] \
            || die "named early-CR/floor case did not fail as a pure assertion"
          [ "$(awk -F'\t' -v t="$LATE_CR_TITLE" '$2 == t { print $1 }' "$gap_tsv")" = "ok" ] || die "named late-CR control did not pass on the baseline"
          [ "$later_setup" -eq 0 ] || die "$later_setup later row(s) failed with a setup-class signal (PRECONDITION or non-testCodeFailure)"
          while IFS= read -r title; do
            [ -n "$title" ] || continue
            [ "$(awk -F'\t' -v t="$title" '$2 == t' "$str_tsv" | awk 'END { print NR }')" -eq 1 ] || die "named R1/R2 case not reported exactly once: $title"
          done <<<"$STRANDED_TITLES"
          for want in "# tests $GAP_CASES" "# pass $((gap_rows - gap_fails))" "# fail $gap_fails" '# cancelled 0' '# skipped 0' '# todo 0'; do
            grep -qx "$want" "$gap_tap" || die "$GAP_TEST summary line missing: $want"
          done
          for want in "# tests $STRANDED_CASES" "# pass $((str_rows - str_fails))" "# fail $str_fails" '# cancelled 0' '# skipped 0' '# todo 0'; do
            grep -qx "$want" "$str_tap" || die "$STRANDED_TEST summary line missing: $want"
          done
          ! grep -Eq 'MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND|EACCES|EPERM|SyntaxError|testTimeoutFailure' "$gap_tap" "$str_tap" || die "module/permission/syntax/timeout error present"
          [ "$bad" -eq 0 ] || exit 1
          echo "RED-A proven: $ini_fail initial control(s) fail as pure assertions on b2fcf098 (early-CR among them), late-CR control passes; 25 later rows are diagnostics only"

      - name: Restore and verify the PR head source
        id: restore
        if: ${{ !cancelled() && steps.pre.outcome == 'success' }}
        run: |
          set -euo pipefail
          git checkout -- src/cli/security-actions.js
          test -z "$(git diff --name-only)"
          echo "PR head source verified clean"

      - name: GREEN — all 37 cases (28 + 9) on the restored PR head (runs even if RED-A failed)
        if: ${{ !cancelled() && steps.pre.outcome == 'success' && steps.install.outcome == 'success' && steps.restore.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          bad=0
          die() { echo "::error::GREEN not proven: $1"; bad=1; }
          # Two separate node processes; each must be exit 0 with every case a plain ok.
          for spec in "$GAP_TEST:$GAP_CASES:gap" "$STRANDED_TEST:$STRANDED_CASES:stranded"; do
            file="${spec%%:*}"; rest="${spec#*:}"; want="${rest%%:*}"; label="${rest#*:}"
            tap="$RUNNER_TEMP/green-$label.tap"; tsv="$RUNNER_TEMP/green-$label.tsv"
            if node --require ./test-support/setup-env.js --test --test-concurrency=1 --test-reporter=tap \
              "$file" > "$tap" 2>&1; then rc=0; else rc=$?; fi
            echo "=== $file"; cat "$tap"; echo "candidate $file exit=$rc"
            awk '
              { raw = $0; sub(/\r$/, "", raw) }
              raw ~ /^(not ok|ok) [0-9]+ - / { st = (raw ~ /^not ok/) ? "not ok" : "ok"; ti = raw
                sub(/^(not ok|ok) [0-9]+ - /, "", ti); printf "%s\t%s\n", st, ti }' "$tap" > "$tsv"
            rows="$(awk 'END { print NR }' "$tsv")"
            plain_ok="$(awk -F'\t' '$1 == "ok" && $2 !~ /# (SKIP|TODO)/' "$tsv" | awk 'END { print NR }')"
            [ "$rc" -eq 0 ] || die "$file exit $rc, expected 0"
            [ "$rows" -eq "$want" ] || die "$file: $rows top-level results, expected $want"
            [ "$plain_ok" -eq "$want" ] || die "$file: plain ok results $plain_ok, expected $want"
            for line in "# tests $want" "# pass $want" '# fail 0' '# cancelled 0' '# skipped 0' '# todo 0'; do
              grep -qx "$line" "$tap" || die "$file summary line missing: $line"
            done
          done
          [ "$(awk -F'\t' -v t="$EARLY_CR_TITLE" '$2 == t { print $1 }' "$RUNNER_TEMP/green-gap.tsv")" = "ok" ] || die "named early-CR/floor case is not a plain ok"
          named=0
          while IFS= read -r title; do
            [ -n "$title" ] || continue
            named=$((named + 1))
            [ "$(awk -F'\t' -v t="$title" '$2 == t { print $1 }' "$RUNNER_TEMP/green-stranded.tsv")" = "ok" ] || die "named R1/R2 case is not a plain ok: $title"
          done <<<"$STRANDED_TITLES"
          [ "$named" -eq "$STRANDED_CASES" ] || die "$named named R1/R2 titles configured, expected $STRANDED_CASES"
          [ "$bad" -eq 0 ] || exit 1
          echo "GREEN proven: $GAP_CASES + $STRANDED_CASES = $((GAP_CASES + STRANDED_CASES)) pass, 0 skipped/todo/cancelled, all 9 R1/R2 cases named"
