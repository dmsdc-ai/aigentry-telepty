name: Inject log format-string regression (task 1215 / format211, original vs fix)

# Task 1215 / release1238 / format211 — ISOLATED DIAGNOSTIC for security208 T3 (javascript/FormatString); not shipped,
# not a release gate. The strict inject catch-all logged `[INJECT] delivery threw for ${id} ...` as console.error's
# FIRST (format) argument and the stack as a later argument. A registered session id containing '%' (for example
# `t%c`) then acts as a util.format directive and can consume the stack. The impact is local log integrity only: the
# HTTP response and the inject_failed event already carry a constant public text.
#
# THIS RUN, once per leg (no rerun, retry, loop or continue-on-error), on the SAME integrated commit:
#   original = ORIGINAL_SHA plus only the frozen test file. The workflow restores src/routes/session-actions.js from
#              ORIGINAL_SHA, and the identity is PROVEN with `git diff --name-only ORIGINAL_SHA`.
#   fix      = ORIGINAL_SHA plus the frozen test file and the one-line correction (exact hashes below).
# Both legs run a genuine `npm ci` (normal lifecycle), then the identical frozen file once, selecting ONLY the test
# "[S24 T3] ..." with --test-name-pattern. They use the exact test:ci preload, with a spec reporter on stdout and a TAP
# file.
# Verdict, recorded separately from the raw exit code:
#   original must show exactly one failing test, the selected one: TAP pass 0 / fail 1 / cancelled 0, with the exact
#            message "MARK-T3 missing from the formatted local log";
#   fix      must show exactly one passing test, the selected one: TAP pass 1 / fail 0 / cancelled 0.
# Setup, import, exit, timing or registration failures never count as the expected RED.
#
# BOUNDS: job <= 10 min; npm ci <= 4 min; test <= 3 min; evidence <= 2 MiB allowlisted, retained 7 days even on failure.
# The default bash shell is `-eo pipefail`, so errexit is disabled explicitly ONLY around each captured command and is
# restored immediately. core.autocrlf stays the runner default, so bytes are verified as sha256 with CR removed.

on:
  push:
    branches:
      - 'diagnostic/format-string-1215-211'

permissions:
  contents: read

jobs:
  regression:
    name: frozen inject log-format regression (${{ matrix.leg }}) — diagnostic only
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        leg: [original, fix]
    defaults:
      run:
        shell: bash
    env:
      LEG: ${{ matrix.leg }}
      ORIGINAL_SHA: ad06e5c4cd71844bf220967af8d49041c1e85da3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # exact controller-supplied pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # exact controller-supplied pin
        with:
          node-version: '20.20.2'

      - name: Select and prove the leg's source identity (exact bytes, CR removed)
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/format-string-1215-evidence"
          mkdir "$EVIDENCE" "$RUNNER_TEMP/format-string-1215-raw"
          lf_sha() { tr -d '\r' < "$1" | sha256sum | cut -d' ' -f1; }
          expect() {
            local got; got="$(lf_sha "$1")"
            printf '%s lf_sha256=%s\n' "$1" "$got" >> "$EVIDENCE/input-hashes.txt"
            [ "$got" = "$2" ] || { echo "::error::$1 is not the reviewed body (lf_sha256 ${got}); nothing was run"; exit 1; }
          }
          NODE_VERSION="$(node --version)"; NPM_VERSION="$(npm --version)"
          printf 'leg=%s\ncommit=%s\noriginal=%s\nnode=%s\nnpm=%s\ncore_autocrlf=%s\n' "$LEG" "$GITHUB_SHA" "$ORIGINAL_SHA" "$NODE_VERSION" "$NPM_VERSION" \
            "$(git config --get core.autocrlf || echo unset)" > "$EVIDENCE/toolchain.txt"
          [ "$NODE_VERSION" = "v20.20.2" ] || { echo "::error::node is ${NODE_VERSION}, not v20.20.2"; exit 1; }
          [ "$NPM_VERSION" = "10.8.2" ] || { echo "::error::npm is ${NPM_VERSION}, not 10.8.2"; exit 1; }
          git cat-file -e "${ORIGINAL_SHA}^{commit}" || { echo "::error::original ${ORIGINAL_SHA} is not in this history; nothing was run"; exit 1; }
          expect test/inject-error-disclosure-1215.test.js 91a8f520dc34dec5a38c363006bdf05064190726668c4404c551460ee64ccbe4
          case "$LEG" in
            fix)
              expect src/routes/session-actions.js d3517d1248a84562431562c933fafbff213859d134c382de92236e2befc9875e
              ALLOWED=".github/workflows/format-string-1215.yml src/routes/session-actions.js test/inject-error-disclosure-1215.test.js" ;;
            original)
              git show "${ORIGINAL_SHA}:src/routes/session-actions.js" > src/routes/session-actions.js
              expect src/routes/session-actions.js 0e2aef69563049c4420986fae953b6da5f6ad86506327da48966b60e55257f12
              ALLOWED=".github/workflows/format-string-1215.yml test/inject-error-disclosure-1215.test.js" ;;
            *) echo "::error::unknown leg"; exit 1 ;;
          esac
          # Identity proof: every path that differs from ORIGINAL_SHA (tracked changes plus untracked files) must be allowed.
          { git diff --name-only "$ORIGINAL_SHA" --; git ls-files --others --exclude-standard; } | sort -u > "$EVIDENCE/identity-vs-original.txt"
          cat "$EVIDENCE/identity-vs-original.txt"
          while IFS= read -r changed; do
            case " $ALLOWED " in *" $changed "*) ;; *) echo "::error::${changed} differs from ${ORIGINAL_SHA} but is not part of the ${LEG} leg"; exit 1 ;; esac
          done < "$EVIDENCE/identity-vs-original.txt"

      - name: npm ci (frozen lock, normal lifecycle; exit recorded)
        id: install
        timeout-minutes: 4
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/format-string-1215-evidence"; RAW="$RUNNER_TEMP/format-string-1215-raw"
          set +e
          npm ci --no-audit --fund=false > "$RAW/npm-ci.stdout" 2> "$RAW/npm-ci.stderr"
          rc=$?
          set -e
          echo "$rc" > "$EVIDENCE/npm-ci.exit_code"
          echo "npm ci exit=${rc}"
          [ "$rc" = 0 ] || exit "$rc"

      - name: Run the selected frozen test once (exact test:ci preload; raw exit, spec and TAP recorded)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/format-string-1215-evidence"; RAW="$RUNNER_TEMP/format-string-1215-raw"
          set +e
          node --require ./test-support/setup-env.js --test --test-name-pattern="^\[S24 T3\]" \
            --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="$RAW/test.tap" \
            test/inject-error-disclosure-1215.test.js > "$RAW/test.stdout" 2> "$RAW/test.stderr"
          rc=$?
          set -e
          echo "$rc" > "$EVIDENCE/test.exit_code"
          tail -n 60 "$RAW/test.stdout" | cut -c1-400
          count() { local v; v="$(grep -E "^# $1 [0-9]+$" "$RAW/test.tap" 2>/dev/null | tail -n 1 | awk '{print $3}')"; echo "${v:-missing}"; }
          pass="$(count pass)"; fail="$(count fail)"; cancelled="$(count cancelled)"
          selected_failed=no; selected_passed=no; t3_message=no
          grep -Eq '^not ok [0-9]+ - \[S24 T3\]' "$RAW/test.tap" 2>/dev/null && selected_failed=yes
          grep -Eq '^ok [0-9]+ - \[S24 T3\]' "$RAW/test.tap" 2>/dev/null && selected_passed=yes
          grep -Fq 'MARK-T3 missing from the formatted local log' "$RAW/test.tap" 2>/dev/null && t3_message=yes
          case "$LEG" in
            original)
              if [ "$rc" != 0 ] && [ "$pass" = 0 ] && [ "$fail" = 1 ] && [ "$cancelled" = 0 ] && [ "$selected_failed" = yes ] && [ "$t3_message" = yes ]; then verdict=expected_red; else verdict=unexpected; fi ;;
            fix)
              if [ "$rc" = 0 ] && [ "$pass" = 1 ] && [ "$fail" = 0 ] && [ "$cancelled" = 0 ] && [ "$selected_passed" = yes ]; then verdict=green; else verdict=fail; fi ;;
          esac
          printf 'leg=%s\ntest_exit=%s\ntap_pass=%s\ntap_fail=%s\ntap_cancelled=%s\nselected_failed=%s\nselected_passed=%s\nt3_message=%s\nverdict=%s\n' \
            "$LEG" "$rc" "$pass" "$fail" "$cancelled" "$selected_failed" "$selected_passed" "$t3_message" "$verdict" > "$EVIDENCE/verdict.txt"
          cat "$EVIDENCE/verdict.txt"
          echo "::notice title=format211 ${LEG} (diagnostic only)::test exit ${rc}; verdict ${verdict}"
          case "$verdict" in expected_red|green) exit 0 ;; *) exit 1 ;; esac

      - name: Bound evidence (allowlisted, <= 2 MiB; runs whatever the commands did)
        id: bound
        if: always()
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/format-string-1215-evidence"; RAW="$RUNNER_TEMP/format-string-1215-raw"
          test -d "$EVIDENCE" && test -d "$RAW" || { echo "::error::no evidence directory; nothing to upload"; exit 1; }
          : > "$EVIDENCE/capture-bounds.txt"
          copy_capped() { # copy_capped NAME MAX_BYTES
            if [ -f "$RAW/$1" ] && [ ! -L "$RAW/$1" ]; then
              local size; size="$(wc -c < "$RAW/$1" | tr -d ' ')"
              head -c "$2" "$RAW/$1" > "$EVIDENCE/$1"
              printf '%s raw_bytes=%s kept_bytes=%s truncated=%s\n' "$1" "$size" "$(wc -c < "$EVIDENCE/$1" | tr -d ' ')" \
                "$([ "$size" -gt "$2" ] && echo yes || echo no)" >> "$EVIDENCE/capture-bounds.txt"
            else
              printf '%s absent\n' "$1" >> "$EVIDENCE/capture-bounds.txt"
            fi
          }
          copy_capped npm-ci.stdout 32768
          copy_capped npm-ci.stderr 32768
          copy_capped test.stdout 262144
          copy_capped test.stderr 262144
          copy_capped test.tap 262144
          for f in npm-ci.exit_code test.exit_code verdict.txt; do [ -f "$EVIDENCE/$f" ] || printf '%s absent (step not reached or ended by its bound)\n' "$f" >> "$EVIDENCE/capture-bounds.txt"; done
          cat "$EVIDENCE/capture-bounds.txt"
          shopt -s dotglob nullglob
          total=0
          for f in "$EVIDENCE"/*; do
            [ -f "$f" ] && [ ! -L "$f" ] || { echo "::error::non-regular evidence entry; not uploading"; exit 1; }
            case "$(basename "$f")" in
              toolchain.txt|input-hashes.txt|identity-vs-original.txt|capture-bounds.txt|npm-ci.exit_code|npm-ci.stdout|npm-ci.stderr|test.exit_code|test.stdout|test.stderr|test.tap|verdict.txt) ;;
              *) echo "::error::unexpected evidence file '$(basename "$f")'; not uploading"; exit 1 ;;
            esac
            total=$((total + $(wc -c < "$f" | tr -d ' ')))
          done
          echo "evidence bytes=${total}"
          [ "$total" -le 2097152 ] || { echo "::error::evidence is ${total} bytes (> 2 MiB); not uploading"; exit 1; }

      - name: Upload evidence (no lockfile, credentials, cache or node_modules)
        if: always() && steps.bound.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # exact controller-supplied pin
        with:
          name: format-string-1215-211-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/format-string-1215-evidence
          if-no-files-found: error
          retention-days: 7
