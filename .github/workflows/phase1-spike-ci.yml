name: phase1-spike-ci

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/measure-rss.sh"
      - ".github/workflows/phase1-spike-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/measure-rss.sh"
      - ".github/workflows/phase1-spike-ci.yml"
  workflow_dispatch:
    inputs:
      rss_supervisors:
        description: "Concurrent supervisors for the RSS smoke (1 or 10)"
        required: false
        default: "10"

# Phase 1 / plan §4 M4 matrix: macOS arm64 + Linux x86_64. Windows is
# explicit Phase 2 deferral (§4.6 — stock portable-pty 0.9.0 insufficient).

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build
        run: cargo build --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
        timeout-minutes: 5

  rss-smoke:
    name: RSS smoke (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: rss measurement (1 supervisor)
        run: bash scripts/measure-rss.sh 1 30
      - name: rss measurement (${{ github.event.inputs.rss_supervisors || '10' }} supervisors)
        run: bash scripts/measure-rss.sh "${{ github.event.inputs.rss_supervisors || '10' }}" 30
