name: Upstream-stall suspension 1270 (RED/GREEN)

# Task 1270 — the user directed that the UPSTREAM_STALLED classification (and the /inject refusal
# derived from it) stay suspended until the missing-Enter defect is conclusively fixed.
#
# This workflow runs ONE dependency-free real-factory test, test/upstream-stall-suspended-1270.test.js
# (taken from the PR head), twice on each OS:
#   RED   — against the frozen baseline abbc08cfbc8c9a24fe4f2e2310206fef416ec06d via TELEPTY_REPO_ROOT.
#           It must fail for the semantic reason only: exit 1, exactly the three silence cases failing
#           with an ERR_ASSERTION whose actual value is 'UPSTREAM_STALLED', and the refusal-boundary case
#           passing. A module, setup, EPERM, syntax or PRECONDITION failure is NOT accepted as RED.
#   GREEN — against the PR head itself: exit 0, 4/4 pass, nothing skipped, cancelled or todo.
# It proves only the suspension behavior. It does NOT prove the missing-Enter fix or live acceptance.
#
# Security posture: no secrets; read-only token; checkout credentials not persisted; no install,
# no publish, no artifact upload; no daemon, PTY or network service is started by the test.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/upstream-stall-suspension-1270.yml'
      - 'scripts/test-suites.json'
      - 'src/mailbox/delivery-runtime.js'
      - 'test/upstream-stall-suspended-1270.test.js'
      - 'test/submit-public-error-contract.test.js'
      - 'test/bridge-output-pipe-732.test.js'

permissions:
  contents: read

concurrency:
  group: upstream-stall-suspension-1270-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  red-green:
    name: suspension RED/GREEN (${{ matrix.os }}, node 26.13.0)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      BASELINE_SHA: abbc08cfbc8c9a24fe4f2e2310206fef416ec06d
      TELEPTY_NO_TAILNET_AUTO: '1'
    steps:
      # SHAs as pinned in bridge-contract-1215.yml (actions/checkout v4.2.2, actions/setup-node v4.4.0).
      - name: Check out the PR head (candidate)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the frozen baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: abbc08cfbc8c9a24fe4f2e2310206fef416ec06d
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.0'

      - name: Preconditions (exact Node, exact trees, no dependencies installed)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.13.0"
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          test ! -e baseline/node_modules
          test ! -e candidate/node_modules
          test -f candidate/test/upstream-stall-suspended-1270.test.js
          test ! -e baseline/test/upstream-stall-suspended-1270.test.js
          test "$(grep -c 'UPSTREAM_STALL_CLASSIFICATION_SUSPENDED' baseline/src/mailbox/delivery-runtime.js || true)" = "0"
          grep -q 'const UPSTREAM_STALL_CLASSIFICATION_SUSPENDED = true;' candidate/src/mailbox/delivery-runtime.js
          echo "preconditions ok"

      - name: RED — same test against the frozen baseline (expected semantic failure)
        working-directory: candidate
        run: |
          set -euo pipefail
          tap="$RUNNER_TEMP/red-baseline.tap"
          # The runner shell already has errexit; an `if` condition is exempt, so the expected
          # nonzero exit is captured and the TAP is printed before anything is judged.
          if TELEPTY_REPO_ROOT="$GITHUB_WORKSPACE/baseline" node --require ./test-support/setup-env.js \
            --test --test-concurrency=1 --test-timeout=120000 --test-reporter=tap \
            test/upstream-stall-suspended-1270.test.js > "$tap" 2>&1; then rc=0; else rc=$?; fi
          cat "$tap"
          echo "baseline exit=$rc"
          bad=0
          die() { echo "::error::RED not proven: $1"; bad=1; }
          # Print the YAML diagnostic block of the top-level result line "<status> N - <title>".
          block() {
            awk -v want="$2" -v st="$1" '
              !inb { l = $0; sub(/^[ \t]+/, "", l); pre = st " "
                     if (substr(l, 1, length(pre)) == pre) { t = l; sub(/^(not ok|ok) [0-9]+ - /, "", t); if (t == want) inb = 1 } }
              inb  { print; if ($0 ~ /^[ \t]*\.\.\.[ \t]*$/) exit }' "$tap"
          }
          [ "$rc" -eq 1 ] || die "exit $rc, expected 1"
          for title in \
            '1270: quiet after an unanswered input/submit is not classified UPSTREAM_STALLED' \
            '1270: output/heartbeat telemetry stays truthful; nothing is invented' \
            '1270: prolonged quiet does not hard-reject the next (recovery) input'; do
            b="$(block 'not ok' "$title")"
            [ -n "$b" ] || { die "no 'not ok' result for: $title"; continue; }
            grep -Eq "failureType: '?testCodeFailure'?" <<<"$b" || die "not a test-code failure: $title"
            grep -Eq "code: '?ERR_ASSERTION'?" <<<"$b" || die "not an assertion failure: $title"
            grep -Eq "actual: '?UPSTREAM_STALLED'?" <<<"$b" || die "failure not caused by UPSTREAM_STALLED: $title"
            ! grep -q 'PRECONDITION' <<<"$b" || die "precondition failure, not semantic RED: $title"
          done
          [ -n "$(block 'ok' '1270: independently grounded refusals are preserved')" ] || die "refusal-boundary case did not pass on baseline"
          for want in '# tests 4' '# pass 1' '# fail 3' '# cancelled 0' '# skipped 0' '# todo 0'; do
            grep -qx "$want" "$tap" || die "summary line missing: $want"
          done
          ! grep -Eq 'MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND|EPERM|SyntaxError|PRECONDITION' "$tap" || die "setup/module/EPERM/syntax/precondition error present"
          [ "$bad" -eq 0 ] || exit 1
          echo "RED proven: baseline fails only on the old silence classification/input refusal"

      - name: GREEN — same test against the PR head
        working-directory: candidate
        run: |
          set -euo pipefail
          unset TELEPTY_REPO_ROOT
          tap="$RUNNER_TEMP/green-candidate.tap"
          # Same capture as RED: a failing run still prints its TAP and exit before the verdict.
          if node --require ./test-support/setup-env.js \
            --test --test-concurrency=1 --test-timeout=120000 --test-reporter=tap \
            test/upstream-stall-suspended-1270.test.js > "$tap" 2>&1; then rc=0; else rc=$?; fi
          cat "$tap"
          echo "candidate exit=$rc"
          bad=0
          die() { echo "::error::GREEN not proven: $1"; bad=1; }
          # Exact-title match of the top-level line "ok N - <title>" (a skipped test carries "# SKIP" and never matches).
          okline() {
            awk -v want="$1" '{ l = $0; sub(/^[ \t]+/, "", l)
              if (substr(l, 1, 3) == "ok ") { t = l; sub(/^ok [0-9]+ - /, "", t); if (t == want) { print; exit } } }' "$tap"
          }
          [ "$rc" -eq 0 ] || die "exit $rc, expected 0"
          for title in \
            '1270: quiet after an unanswered input/submit is not classified UPSTREAM_STALLED' \
            '1270: output/heartbeat telemetry stays truthful; nothing is invented' \
            '1270: prolonged quiet does not hard-reject the next (recovery) input' \
            '1270: independently grounded refusals are preserved'; do
            [ -n "$(okline "$title")" ] || die "no plain 'ok' result for: $title"
          done
          for want in '# tests 4' '# pass 4' '# fail 0' '# cancelled 0' '# skipped 0' '# todo 0'; do
            grep -qx "$want" "$tap" || die "summary line missing: $want"
          done
          ! grep -Eq '^[[:space:]]*not ok ' "$tap" || die "a 'not ok' result is present"
          [ "$bad" -eq 0 ] || exit 1
          echo "GREEN proven: 4/4 pass, 0 skipped/todo/cancelled"
