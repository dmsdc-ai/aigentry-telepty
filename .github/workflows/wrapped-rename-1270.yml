name: Wrapped live rename 1270 (RED/GREEN)

# Task 1270 — a live owner/viewer WebSocket must stay bound to its admitted session instance across a
# supported rename (src/transport/websocket.js). This workflow runs ONE focused test,
# test/wrapped-live-rename-1270.test.js, twice per OS, on the exact PR head:
#   RED   — with ONLY src/transport/websocket.js overlaid from the frozen baseline commit
#           1a51d30a81fb0ad5a3e64d363dea72e84151da77 (blob sha256 pinned below). The test body,
#           fixtures and installed dependencies are the PR head's, byte-identical in both runs.
#           RED is accepted only if exit 1 and EXACTLY the six rename-continuity/identity cases
#           T2..T7 fail with an ERR_ASSERTION carrying their own expected message, while T1 and T8
#           pass. Module, setup, EACCES/EPERM, syntax or PRECONDITION failures are NOT accepted as RED.
#   GREEN — after restoring and verifying the PR head source: exit 0, 8/8 pass, nothing
#           skipped, cancelled or todo.
# The test drives the real production handlers in-process (no listener, no TLS, no network). It
# proves daemon-side routing only — not native provider Enter, the current Root or a live upgrade.
#
# Security posture: no secrets; read-only token; checkout credentials not persisted; dependencies
# from the frozen lockfile via `npm ci --ignore-scripts` (no lifecycle/publication hooks); no
# publish, no artifact upload, no service or live operation.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wrapped-rename-1270.yml'
      - 'scripts/test-suites.json'
      - 'src/transport/websocket.js'
      - 'src/routes/session-records.js'
      - 'test/wrapped-live-rename-1270.test.js'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: wrapped-rename-1270-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  red-green:
    name: rename RED/GREEN (${{ matrix.os }}, node 26.13.0)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      BASELINE_SHA: 1a51d30a81fb0ad5a3e64d363dea72e84151da77
      BASELINE_WS_SHA256: 6ce884cfc37e4d720a050a92bb825cda5c84ee6c1481effe915548c82672ca67
      TELEPTY_NO_TAILNET_AUTO: '1'
      TELEPTY_SKIP_POSTINSTALL: '1'
      NO_UPDATE_NOTIFIER: '1'
    steps:
      # SHAs as pinned in bridge-contract-1215.yml (actions/checkout v4.2.2, actions/setup-node v4.4.0).
      # Full history so the frozen baseline commit can be read from the same checkout.
      - name: Check out the PR head with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.0'

      - name: Preconditions (exact Node, exact head, exact baseline module)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha256() { node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$1"; }
          test "$(node --version)" = "v26.13.0"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git show "${BASELINE_SHA}:src/transport/websocket.js" > "$RUNNER_TEMP/baseline-websocket.js"
          test "$(sha256 "$RUNNER_TEMP/baseline-websocket.js")" = "$BASELINE_WS_SHA256"
          if cmp -s "$RUNNER_TEMP/baseline-websocket.js" src/transport/websocket.js; then
            echo "::error::PR head websocket.js equals the baseline module; nothing to compare"; exit 1
          fi
          test -f test/wrapped-live-rename-1270.test.js
          test -z "$(git diff --name-only)"
          if git merge-base --is-ancestor "$BASELINE_SHA" HEAD; then echo "baseline is an ancestor of HEAD"; else echo "baseline is NOT an ancestor of HEAD (recorded, not required)"; fi
          echo "preconditions ok"

      - name: Install locked dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-cache"
          npm ci --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache"
          node -e "require('ws'); console.log('ws ok')"

      - name: RED — focused test with ONLY the baseline websocket.js overlaid
        run: |
          set -euo pipefail
          sha256() { node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$1"; }
          tap="$RUNNER_TEMP/red-baseline.tap"
          test_sha_before="$(sha256 test/wrapped-live-rename-1270.test.js)"
          cp "$RUNNER_TEMP/baseline-websocket.js" src/transport/websocket.js
          test "$(sha256 src/transport/websocket.js)" = "$BASELINE_WS_SHA256"
          test "$(git diff --name-only)" = "src/transport/websocket.js"
          # Actions runs bash with errexit; an `if` condition is exempt, so the expected nonzero exit
          # is captured, then the candidate module is restored before anything is judged.
          if node --require ./test-support/setup-env.js --test --test-concurrency=1 --test-timeout=120000 --test-reporter=tap \
            test/wrapped-live-rename-1270.test.js > "$tap" 2>&1; then rc=0; else rc=$?; fi
          git checkout -- src/transport/websocket.js
          cat "$tap"
          echo "baseline exit=$rc"
          bad=0
          die() { echo "::error::RED not proven: $1"; bad=1; }
          test -z "$(git diff --name-only)" || die "candidate source not restored"
          [ "$(sha256 test/wrapped-live-rename-1270.test.js)" = "$test_sha_before" ] || die "test file changed during RED"
          block() {
            awk -v want="$2" -v st="$1" '
              !inb { l = $0; sub(/^[ \t]+/, "", l); pre = st " "
                     if (substr(l, 1, length(pre)) == pre) { t = l; sub(/^(not ok|ok) [0-9]+ - /, "", t); if (t == want) inb = 1 } }
              inb  { print; if ($0 ~ /^[ \t]*\.\.\.[ \t]*$/) exit }' "$tap"
          }
          [ "$rc" -eq 1 ] || die "exit $rc, expected 1"
          red_titles=(
            '1270 T2: a supported rename keeps the same connected owner and every stream continuous'
            '1270 T3: an owner close after rename detaches only the admitted renamed record'
            '1270 T4: a different instance later filed under the old name never receives the renamed owner (ABA)'
            '1270 T5: renamed and then removed — frames and close are inert everywhere'
            '1270 T6: viewer input after rename obeys the existing authorization verdict'
            '1270 T7: the credential follows the rename; an unauthenticated owner claim on the new name is refused'
          )
          red_messages=(
            'timed out waiting for: owner output after rename reaches the renamed record'
            'timed out waiting for: owner slot of the renamed record cleared on close'
            'timed out waiting for: output stays with the renamed instance'
            'the old-name instance is not written'
            'timed out waiting for: authorized input delivered'
            'timed out waiting for: admitted owner still feeds the record'
          )
          for i in "${!red_titles[@]}"; do
            title="${red_titles[$i]}"
            b="$(block 'not ok' "$title")"
            [ -n "$b" ] || { die "no 'not ok' result for: $title"; continue; }
            grep -Eq "failureType: '?testCodeFailure'?" <<<"$b" || die "not a test-code failure: $title"
            grep -Eq "code: '?ERR_ASSERTION'?" <<<"$b" || die "not an assertion failure: $title"
            grep -Fq "${red_messages[$i]}" <<<"$b" || die "failed on an unexpected assertion: $title"
            ! grep -q 'PRECONDITION' <<<"$b" || die "precondition failure, not semantic RED: $title"
          done
          for title in \
            '1270 T1: the original stream feeds the admitted record' \
            '1270 T8: an unrelated unrenamed session is unaffected'; do
            [ -n "$(block 'ok' "$title")" ] || die "control case did not pass on baseline: $title"
          done
          for want in '# tests 8' '# pass 2' '# fail 6' '# cancelled 0' '# skipped 0' '# todo 0'; do
            grep -qx "$want" "$tap" || die "summary line missing: $want"
          done
          ! grep -Eq 'MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND|EACCES|EPERM|SyntaxError|PRECONDITION' "$tap" || die "setup/module/permission/syntax/precondition error present"
          [ "$bad" -eq 0 ] || exit 1
          echo "RED proven: baseline fails exactly the six rename continuity/identity assertions"

      - name: GREEN — same focused test on the restored PR head
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          tap="$RUNNER_TEMP/green-candidate.tap"
          if node --require ./test-support/setup-env.js --test --test-concurrency=1 --test-timeout=120000 --test-reporter=tap \
            test/wrapped-live-rename-1270.test.js > "$tap" 2>&1; then rc=0; else rc=$?; fi
          cat "$tap"
          echo "candidate exit=$rc"
          bad=0
          die() { echo "::error::GREEN not proven: $1"; bad=1; }
          okline() {
            awk -v want="$1" '{ l = $0; sub(/^[ \t]+/, "", l)
              if (substr(l, 1, 3) == "ok ") { t = l; sub(/^ok [0-9]+ - /, "", t); if (t == want) { print; exit } } }' "$tap"
          }
          [ "$rc" -eq 0 ] || die "exit $rc, expected 0"
          for title in \
            '1270 T1: the original stream feeds the admitted record' \
            '1270 T2: a supported rename keeps the same connected owner and every stream continuous' \
            '1270 T3: an owner close after rename detaches only the admitted renamed record' \
            '1270 T4: a different instance later filed under the old name never receives the renamed owner (ABA)' \
            '1270 T5: renamed and then removed — frames and close are inert everywhere' \
            '1270 T6: viewer input after rename obeys the existing authorization verdict' \
            '1270 T7: the credential follows the rename; an unauthenticated owner claim on the new name is refused' \
            '1270 T8: an unrelated unrenamed session is unaffected'; do
            [ -n "$(okline "$title")" ] || die "no plain 'ok' result for: $title"
          done
          for want in '# tests 8' '# pass 8' '# fail 0' '# cancelled 0' '# skipped 0' '# todo 0'; do
            grep -qx "$want" "$tap" || die "summary line missing: $want"
          done
          ! grep -Eq '^[[:space:]]*not ok ' "$tap" || die "a 'not ok' result is present"
          [ "$bad" -eq 0 ] || exit 1
          echo "GREEN proven: 8/8 pass, 0 skipped/todo/cancelled"
