name: Bound inject 1270 (diagnostic)

# Task 1270 — dedicated non-default diagnostic for the bound busy-input transport (inject-bound-v1 verb,
# POST /api/sessions/:id/inject-bound-v1, telepty.bound-inject/v1 -> telepty.bound-inject-result/v1).
# Runs ONLY the two 1270 bound files, serially, on ubuntu with Node 26.13.0, prints the raw TAP and exits with the test
# runner's real numeric status. No validator, skip, retry or name filter.
#
# Phase A (21f13ca1 baseline): run 43823980085 / job 133153310367 was RED exactly as intended — exit 1, 6 top-level,
# 0 pass / 6 FAIL, every failure an ERR_ASSERTION at a named CHECKPOINT, no setup/import/module failure.
# Phase B (this source change) expects BOTH files green, and that must be the job's own numeric exit, not a claim.
# Phase B r1 (review repair): the green file gained a Part 6 for the review findings — the viewer-input gate, the
# #533 peer-lane block, the audit line, the provenance banner, admission at the await, a throw after the body, and
# the persisted strand. Two more production files are in the change set (src/transport/websocket.js,
# src/session-store/persistence.js) and are therefore in the path filter and the provenance hashes below.
# A green run proves only these in-process cases on this runner: frames handed to a recorder are DAEMON HAND-OFF only
# (sent_to_bridge) — never a PTY write, native busy queueing, auto-submit or model consumption, which remain a
# separately reviewed actual-native gate.
#
# Trigger: push to the dedicated non-default diagnostic branch only, and only when this workflow, one of the two test
# files, the suite registry, or one of the production/helper files the change actually touches is modified — so the
# phase-B push that carries the implementation triggers it instead of silently skipping.
# No pull_request, default-branch, tag or release trigger. (Branch visibility is the repository's; this workflow is
# non-default, not private.)
#
# Security posture (as in boot-create-only-1270.yml / service-twoarg-1270.yml):
# - no secrets; `contents: read` only; checkout credentials not persisted;
# - dependencies from the frozen lockfile with `npm ci --ignore-scripts` (no lifecycle scripts, no native build: the test
#   requires neither node-pty nor daemon.js);
# - private HOME/USERPROFILE/TMPDIR/npm cache under RUNNER_TEMP; the test itself starts no listener, daemon, bridge or
#   provider process;
# - the uploaded artifact is plain text (TAP + provenance) written by this job, uploaded on failure only and never executed;
# - no publish, deploy, service or live operation.

on:
  push:
    branches:
      - 'diagnostic/1270-bound-delivery-20261116'
    paths:
      - '.github/workflows/bound-inject-1270.yml'
      - 'test/inject-bound-v1-1270.test.js'
      - 'test/inject-bound-v1-green-1270.test.js'
      - 'test/boot-create-only-1270.test.js'
      - 'scripts/test-suites.json'
      - 'cli.js'
      - 'daemon.js'
      - 'src/routes/session-actions.js'
      - 'src/mailbox/delivery-runtime.js'
      - 'src/mailbox/session-delivery.js'
      - 'src/protocol/bound-inject.js'
      - 'src/cli/inject-bound-v1.js'
      # r1: the two files the review round added to the change set.
      - 'src/transport/websocket.js'
      - 'src/session-store/persistence.js'
      # r2: the GUI submit arm (the last Enter producer that writes no bytes).
      - 'src/routes/session-inspection.js'
      # Task 1270 operator clear: the RED seal for clear-strand-v1 (phase A) and the files its implementation
      # touches, so the push that carries either one triggers this diagnostic instead of silently skipping.
      - 'test/clear-strand-v1-1270.test.js'
      - 'src/protocol/clear-strand.js'
      - 'src/cli/clear-strand-v1.js'
      - 'src/transport/readiness-handshake.js'
      - 'src/audit/inject-log.js'

permissions:
  contents: read

concurrency:
  group: bound-inject-1270-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bound-inject:
    name: bound inject (ubuntu-latest, node 26.13.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      # The frozen phase-A file first, then the phase-B additions. Serial, one process, one numeric exit.
      TEST_FILES: test/inject-bound-v1-1270.test.js test/inject-bound-v1-green-1270.test.js
      TELEPTY_NO_TAILNET_AUTO: '1'
      TELEPTY_SKIP_POSTINSTALL: '1'
      NO_UPDATE_NOTIFIER: '1'
      TELEPTY_DISABLE_UPDATE_NOTIFIER: '1'
    steps:
      # SHAs as pinned in bridge-contract-1215.yml (actions/checkout v4.2.2, actions/setup-node v4.4.0).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.0'

      - name: Private HOME, TMPDIR and npm cache
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/bound-1270"
          mkdir -p "$base/home" "$base/tmp" "$base/npm-cache" "$base/evidence"
          chmod 700 "$base" "$base/home" "$base/tmp" "$base/npm-cache" "$base/evidence"
          {
            echo "HOME=$base/home"
            echo "USERPROFILE=$base/home"
            echo "TMPDIR=$base/tmp"
            echo "npm_config_cache=$base/npm-cache"
            echo "EVIDENCE=$base/evidence"
          } >> "$GITHUB_ENV"

      - name: Provenance (exact Node, exact commit, test and source hashes)
        env:
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256() { node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$1"; }
          test "$(node --version)" = "v26.13.0"
          test "$(git rev-parse HEAD)" = "$PUSHED_SHA"
          for f in $TEST_FILES; do test -f "$f"; done
          test -z "$(git status --porcelain)"
          {
            echo "node=$(node --version)"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            for f in $TEST_FILES test/boot-create-only-1270.test.js scripts/test-suites.json \
              cli.js src/routes/session-actions.js src/mailbox/delivery-runtime.js \
              src/mailbox/session-delivery.js src/protocol/bound-inject.js src/cli/inject-bound-v1.js \
              src/transport/websocket.js src/session-store/persistence.js src/routes/session-inspection.js \
              src/cli/security-actions.js src/protocol/http-auth.js \
              src/protocol/client-profiles.js src/principal/http.js src/audit/provenance.js \
              daemon.js package-lock.json; do
              if [ -f "$f" ]; then echo "sha256 $(sha256 "$f") $f"; else echo "sha256 MISSING $f"; fi
            done
          } | tee "$EVIDENCE/provenance.txt"

      - name: Install locked dependencies without lifecycle scripts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$EVIDENCE/npm-ci.log"

      - name: Run the bound inject files alone (raw TAP streamed, real exit, 60 s bound)
        run: |
          set +e
          set -uo pipefail
          tap="$EVIDENCE/inject-bound-v1-1270.tap"
          # Unquoted on purpose: TEST_FILES is this workflow's own fixed, space-separated, glob-free literal.
          timeout --kill-after=5s 60s node --require ./test-support/setup-env.js --test --test-concurrency=1 \
            --test-timeout=60000 --test-reporter=tap $TEST_FILES 2>&1 | tee "$tap"
          statuses=("${PIPESTATUS[@]}")
          rc="${statuses[0]}"; tee_rc="${statuses[1]}"
          if [ "$tee_rc" -ne 0 ]; then echo "::error::tee failed (exit $tee_rc); the TAP log may be incomplete"; [ "$rc" -ne 0 ] || rc="$tee_rc"; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then echo "::error::test process hit the 60 s bound (exit $rc)"; fi
          {
            echo "---- summary ----"
            grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo) ' "$tap" || echo "no TAP summary lines found"
            echo "top-level results:"
            grep -E '^(not )?ok [0-9]+ - ' "$tap" || echo "(none)"
            echo "test exit=$rc"
            echo "head=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
          } | tee "$EVIDENCE/summary.txt"
          exit "$rc"

      # Task 1270 operator clear — the clear-strand file alone, with its own TAP and its own numeric exit.
      # `!cancelled()` on purpose: this file is an independent diagnostic, so its RED (phase A) or GREEN (phase B)
      # is MEASURED even when the bound step above exited non-zero, instead of being hidden by it.
      - name: Run the clear-strand file alone (raw TAP streamed, real exit, 60 s bound)
        if: ${{ !cancelled() }}
        env:
          CLEAR_TEST_FILES: test/clear-strand-v1-1270.test.js
        run: |
          set +e
          set -uo pipefail
          tap="$EVIDENCE/clear-strand-v1-1270.tap"
          # Unquoted on purpose: CLEAR_TEST_FILES is this workflow's own fixed, space-separated, glob-free literal.
          timeout --kill-after=5s 60s node --require ./test-support/setup-env.js --test --test-concurrency=1 \
            --test-timeout=60000 --test-reporter=tap $CLEAR_TEST_FILES 2>&1 | tee "$tap"
          statuses=("${PIPESTATUS[@]}")
          rc="${statuses[0]}"; tee_rc="${statuses[1]}"
          if [ "$tee_rc" -ne 0 ]; then echo "::error::tee failed (exit $tee_rc); the TAP log may be incomplete"; [ "$rc" -ne 0 ] || rc="$tee_rc"; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then echo "::error::clear-strand test process hit the 60 s bound (exit $rc)"; fi
          {
            echo "---- clear-strand summary ----"
            grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo) ' "$tap" || echo "no TAP summary lines found"
            echo "top-level results:"
            grep -E '^(not )?ok [0-9]+ - ' "$tap" || echo "(none)"
            echo "clear-strand exit=$rc"
            echo "head=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
          } | tee "$EVIDENCE/clear-strand-summary.txt"
          exit "$rc"

      # actions/upload-artifact pinned to the v4 tag's commit ea165f8d65b6e75b540449e92b4886f43607fa02, as recorded in
      # service-twoarg-1270.yml / fixture-lifetime-1270.yml. Only this job's own text evidence; never HOME, config or caches.
      - name: Upload TAP and provenance (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bound-inject-1270-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bound-1270/evidence
          if-no-files-found: warn
          retention-days: 14
