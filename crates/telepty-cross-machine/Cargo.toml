[package]
name = "telepty-cross-machine"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone HTTP peer client and registry for telepty cross-machine operations"
build = "build.rs"

[lib]
name = "telepty_cross_machine"
path = "src/lib.rs"

[[bin]]
name = "telepty-cross-machine-bin"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
